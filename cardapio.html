<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardápio Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- O supabase.js precisa estar na mesma pasta. Se não existir, vai dar erro aqui. -->
  <script src="supabase.js"></script>
  <style>
    :root { --verde:#168b53; --cinza:#64748b; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f7f5; margin: 0; padding-bottom: 50px; color: #263640; }
    .debug { background: #fee2e2; color: #991b1b; padding: 15px; font-family: monospace; font-size: 13px; display: none; border-bottom: 2px solid #dc2626; }
    .header { background: linear-gradient(135deg, #168b53, #0f6b3f); color: #fff; padding: 16px; text-align: center; }
    .info-estab { background: #fff; margin: 16px; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .info-estab h2 { margin: 0 0 8px 0; font-size: 18px; color: #168b53; }
    .info-estab p { margin: 4px 0; font-size: 14px; color: #475569; }
    .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
    .produto { background: #fff; border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .produto img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
    .produto .nome { font-weight: bold; font-size: 13px; margin: 8px 0; }
    .produto .preco { color: #168b53; font-weight: bold; }
  </style>
</head>
<body>

<!-- Painel de Erros -->
<div id="painelErro" class="debug"></div>

<div class="header">
  <h1>🏪 Cardápio Digital</h1>
</div>

<div class="info-estab" id="cardEstab">
  <h2 id="nomeEstab">Carregando dados da loja...</h2>
  <p id="endEstab"></p>
  <p id="horEstab"></p>
  <p id="taxaEstab"></p>
</div>

<div id="gradeProdutos" class="grade">
  <p style="grid-column: 1/-1; text-align: center;">Carregando produtos...</p>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const comercioId = urlParams.get('loja') || urlParams.get('id');
  const painelErro = document.getElementById('painelErro');

  function mostrarErro(msg) {
    painelErro.style.display = 'block';
    painelErro.innerHTML += `❌ ERRO: ${msg}<br><br>`;
  }

  async function initCardapio() {
    // 1. Verifica se o link tem o ID
    if (!comercioId) {
      return mostrarErro("O link não tem o ID da loja (parâmetro ?loja=).");
    }

    // 2. Verifica se o arquivo supabase.js carregou e criou a conexão
    if (!window.supabaseClient) {
      return mostrarErro("A biblioteca do Supabase não foi encontrada. Verifique se o arquivo 'supabase.js' existe na pasta do GitHub e se a URL/chave estão corretas dentro dele.");
    }

    try {
      // 3. Tenta buscar os dados da loja
      const { data: com, error: errCom } = await window.supabaseClient.from('comercios').select('*').eq('id', comercioId).maybeSingle();
      
      if (errCom) throw new Error("Erro na tabela 'comercios': " + errCom.message);
      
      if (!com) {
        mostrarErro("O banco de dados não encontrou a loja com este ID. Pode ser que o RLS (Row Level Security) do Supabase esteja bloqueando a leitura pública.");
      } else {
        document.getElementById('nomeEstab').textContent = com.nome || 'Sem nome';
      }

      // 4. Tenta buscar os dados do estabelecimento (endereço, horário)
      const { data: dad, error: errDad } = await window.supabaseClient.from('dados_estabelecimento').select('*').eq('comercio_id', comercioId).maybeSingle();
      
      if (errDad) throw new Error("Erro na tabela 'dados_estabelecimento': " + errDad.message);

      if (dad) {
        document.getElementById('endEstab').innerHTML = `📍 ${dad.endereco || 'Sem endereço'}, ${dad.cidade || ''}`;
        document.getElementById('horEstab').innerHTML = `🕐 De ${dad.horario_abertura || '--'} às ${dad.horario_fechamento || '--'}`;
        document.getElementById('taxaEstab').innerHTML = `🛵 Taxa de entrega: R$ ${Number(dad.taxa_entrega || 0).toFixed(2).replace('.', ',')}`;
      } else {
        document.getElementById('endEstab').innerHTML = "⚠️ Os dados de endereço/horário não foram encontrados no banco. (Bloqueio de RLS?)";
      }

      // 5. Tenta buscar os produtos
      const { data: prods, error: errProds } = await window.supabaseClient.from('estoque_produtos').select('*').eq('comercio_id', comercioId).gt('quantidade', 0);
      
      if (errProds) throw new Error("Erro na tabela 'estoque_produtos': " + errProds.message);

      const grade = document.getElementById('gradeProdutos');
      if (!prods || prods.length === 0) {
        grade.innerHTML = '<p style="grid-column:1/-1;text-align:center;">Nenhum produto encontrado (ou bloqueado por RLS).</p>';
      } else {
        grade.innerHTML = prods.map(p => `
          <div class="produto">
            ${p.foto ? `<img src="${p.foto}">` : `<div style="height:100px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;">🍔</div>`}
            <div class="nome">${p.nome}</div>
            <div class="preco">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</div>
          </div>
        `).join('');
      }

    } catch (err) {
      mostrarErro(err.message);
      console.error(err);
    }
  }

  window.addEventListener('DOMContentLoaded', initCardapio);
</script>
</body>
</html>
