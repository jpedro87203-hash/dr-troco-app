<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardápio Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    :root { --verde:#168b53; --verde-claro:#eaf8f0; --texto:#263640; --cinza:#64748b; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f7f5; margin: 0; padding-bottom: 120px; color: var(--texto); }

    .erro-topo { background: #fee2e2; color: #991b1b; padding: 15px; text-align: center; font-size: 13px; font-weight: bold; display: none; border-bottom: 2px solid #dc2626; }

    .header { background: linear-gradient(135deg, #168b53, #0f6b3f); color: #fff; padding: 16px 16px 20px; border-radius: 0 0 22px 22px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,.12); }
    .header-topo { display: flex; align-items: flex-start; gap: 12px; }
    .logo-estab { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; overflow: hidden; }
    .logo-estab img { width: 100%; height: 100%; object-fit: cover; }
    .info-estab { flex: 1; min-width: 0; }
    .info-estab h1 { margin: 0; font-size: 18px; font-weight: 900; line-height: 1.2; word-break: break-word; }
    .info-estab p { margin: 4px 0 0; font-size: 12px; opacity: .92; line-height: 1.4; }
    .badge-status { display: inline-block; margin-top: 7px; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 900; background: rgba(255,255,255,.22); }
    .badge-status.fechado { background: #dc2626; }

    .box-acompanhar { background: #fff; border-radius: 12px; padding: 8px 12px; margin-top: 14px; display: flex; gap: 8px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .box-acompanhar input { flex: 1; border: 0; outline: none; font-size: 14px; font-weight: bold; color: #1e293b; padding: 4px 0; text-transform: uppercase; background: transparent; }
    .box-acompanhar button { background: #1e293b; color: #fff; border: 0; padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }

    .barra-busca { margin-top: 10px; display: flex; gap: 8px; }
    .barra-busca input { flex: 1; height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font-size: 14px; outline: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .btn-limpar { width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(255,255,255,.22); color: #fff; font-size: 18px; cursor: pointer; display: none; }
    .btn-limpar.visivel { display: flex; align-items: center; justify-content: center; }

    .container { max-width: 640px; margin: 0 auto; padding: 16px; }

    .aviso-loja { background: #fff7ed; border-left: 4px solid #ea580c; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .aviso-loja-titulo { font-size: 13px; font-weight: 900; color: #c2410c; margin-bottom: 4px; }
    .aviso-loja-texto { font-size: 13px; color: #7c2d12; line-height: 1.5; font-weight: 600; white-space: pre-line; }

    .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 500px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    .produto { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.04); display: flex; flex-direction: column; text-align: center; cursor: pointer; transition: transform .15s; }
    .produto:active { transform: scale(.985); }
    .produto .foto { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .produto .nome { font-size: 13px; font-weight: 800; margin: 8px 0 4px; height: 36px; overflow: hidden; line-height: 1.3; }
    .produto .descricao { font-size: 11px; color: #64748b; line-height: 1.35; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; }
    .produto .preco { font-size: 15px; font-weight: 900; color: var(--verde); margin-bottom: 8px; }
    .controle { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: auto; }
    .controle button { width: 34px; height: 34px; border: 0; border-radius: 9px; background: var(--verde-claro); color: var(--verde); font-size: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .controle button:disabled { opacity: .35; cursor: not-allowed; }
    .controle .qtd { min-width: 24px; text-align: center; font-weight: 900; font-size: 14px; }
    .aviso-vazio { text-align: center; padding: 40px 16px; color: var(--cinza); grid-column: 1/-1; }

    .bottom-bars { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; }
    .carrinho-bar { background: #fff; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 15px rgba(0,0,0,.1); display: none; align-items: center; justify-content: space-between; gap: 10px; }
    .carrinho-bar.visivel { display: flex; }
    .carrinho-info { flex: 1; min-width: 0; }
    .carrinho-info span { font-size: 11px; color: var(--cinza); font-weight: bold; display: block; }
    .carrinho-info strong { font-size: 17px; color: #1f3028; display: block; }
    .carrinho-info small { font-size: 10px; color: var(--cinza); display: block; margin-top: 2px; }
    .btn-finalizar { background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 900; font-size: 14px; cursor: pointer; white-space: nowrap; }

    .modal { position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 30; display: none; align-items: flex-end; }
    .modal.aberto { display: flex; }
    .modal-box { background: #fff; width: 100%; max-height: 92vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; animation: slideUp .2s ease; position: relative; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-box h2 { margin: 0 0 16px; font-size: 20px; }

    .secao-titulo { font-size: 12px; font-weight: 900; color: var(--verde); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px; padding-top: 6px; border-top: 1px dashed #e2e8f0; }
    .secao-titulo:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    .item-carrinho { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; gap: 10px; }
    .mini-controle { display: flex; align-items: center; gap: 4px; }
    .mini-controle button { width: 28px; height: 28px; border: 0; border-radius: 7px; font-weight: 900; font-size: 15px; cursor: pointer; background: var(--verde-claro); color: var(--verde); }
    .mini-controle .remover { background: #fff0f0; color: #d94b4b; }

    .form-campo { margin-bottom: 12px; }
    .form-campo label { display: block; font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 4px; }
    .form-campo input, .form-campo select, .form-campo textarea { width: 100%; height: 46px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0 12px; font-size: 14px; outline: none; }
    .form-campo textarea { height: 70px; padding: 10px 12px; resize: none; }
    .form-campo input:focus, .form-campo select:focus, .form-campo textarea:focus { border-color: var(--verde); }
    .linha-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

    .bloco-pix { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 12px; margin-bottom: 12px; display: none; }
    .bloco-pix .label-pix { font-size: 12px; font-weight: 900; color: #0369a1; margin-bottom: 6px; text-transform: uppercase; }
    .bloco-pix .chave-pix { background: #fff; border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 13px; color: #0c4a6e; font-weight: 700; word-break: break-all; }
    .bloco-pix .btn-copiar-pix { background: #0284c7; color: #fff; border: 0; border-radius: 8px; padding: 10px; font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 8px; width: 100%; }
    .bloco-pix .aviso-pix { font-size: 12px; color: #b45309; background: #fef3c7; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: 700; line-height: 1.45; }

    .resumo-total { background: #f8fafc; border-radius: 12px; padding: 12px; margin: 12px 0; font-size: 13px; }
    .resumo-total .linha { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .resumo-total .linha:last-child { margin-bottom: 0; font-size: 16px; font-weight: 900; border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: 8px; }

    .btn-confirmar { width: 100%; background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 900; margin-top: 10px; cursor: pointer; }
    .btn-confirmar:disabled { opacity: .6; }
    .btn-voltar { width: 100%; background: transparent; border: 0; margin-top: 10px; color: var(--cinza); font-weight: bold; padding: 10px; cursor: pointer; }

    .step-container { display: flex; justify-content: space-between; margin: 24px 0; position: relative; }
    .step-container::before { content: ''; position: absolute; top: 14px; left: 20px; right: 20px; height: 4px; background: #e2e8f0; z-index: 1; }
    .step-progress { position: absolute; top: 14px; left: 20px; height: 4px; background: #10b981; z-index: 2; transition: width 0.4s ease; width: 0%; }
    .step-item { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 60px; }
    .step-icon { width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
    .step-item.ativo .step-icon { background: #10b981; color: #fff; box-shadow: 0 0 0 4px #d1fae5; }
    .step-item small { font-size: 10px; font-weight: 800; color: #64748b; text-align: center; }
    .step-item.ativo small { color: #10b981; }
    .info-acompanhar { background: #f8fafc; border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; color: #334155; text-align: center; }
    .info-acompanhar strong { color: #0f172a; }

    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-120px); background: #1f3028; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 800; z-index: 100; transition: transform .3s; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    .toast.visivel { transform: translateX(-50%) translateY(0); }
    .toast.erro { background: #dc2626; }

    /* MODAL DE DETALHE DO PRODUTO */
    .modal-detalhe-produto .modal-box { max-height: 88vh; }
    .btn-fechar-produto {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,.95);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      z-index: 2;
    }
    .modal-produto-foto {
      width: 100%;
      max-height: 240px;
      min-height: 160px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 16px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      overflow: hidden;
    }
    .modal-detalhe-produto h2 { margin: 0 0 8px; font-size: 22px; font-weight: 900; color: #1e293b; line-height: 1.25; padding-right: 40px; }
    .modal-produto-descricao { margin: 0 0 16px; font-size: 14px; color: #475569; line-height: 1.55; white-space: pre-line; }
    .modal-produto-preco { font-size: 26px; font-weight: 900; color: var(--verde); margin-bottom: 20px; }
    .modal-produto-qtd { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; padding: 12px; background: #f8fafc; border-radius: 14px; }
    .modal-produto-qtd button { width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--verde-claro); color: var(--verde); font-size: 24px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-produto-qtd button:disabled { opacity: .4; cursor: not-allowed; }
    .modal-produto-qtd span { font-size: 22px; font-weight: 900; min-width: 40px; text-align: center; }
    .btn-add-produto { width: 100%; background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 900; cursor: pointer; }
    .btn-ver-carrinho { width: 100%; background: transparent; border: 0; margin-top: 10px; padding: 12px; color: var(--cinza); font-size: 13px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

<div id="painelErro" class="erro-topo"></div>

<div class="header" id="headerEstab">
  <div class="header-topo">
    <div class="logo-estab">🏪</div>
    <div class="info-estab">
      <h1 id="nomeEstab">Carregando...</h1>
      <p id="infoEstab"></p>
      <span class="badge-status" id="badgeStatus" style="display:none;"></span>
    </div>
  </div>

  <div class="box-acompanhar">
    <span style="font-size:18px;">🔎</span>
    <input type="text" id="inputRastreio" placeholder="Ex: A1B2C3D4" maxlength="8" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
    <button onclick="rastrearPedidoManual()">Status</button>
  </div>

  <div class="barra-busca">
    <input type="text" id="buscaProduto" placeholder="🔍 Pesquisar produto..." autocomplete="off">
    <button class="btn-limpar" id="btnLimparBusca" onclick="limparBusca()">✕</button>
  </div>
</div>

<div class="container">
  <div id="avisoFechado"></div>
  <div id="avisoLoja"></div>
  <div id="gradeProdutos" class="grade">
    <p class="aviso-vazio">Carregando cardápio...</p>
  </div>
</div>

<div class="bottom-bars">
  <div class="carrinho-bar" id="carrinhoBar">
    <div class="carrinho-info">
      <span id="qtdCarrinho" style="font-size:11px; color:#64748b; font-weight:bold;">0 itens</span>
      <strong id="totalCarrinho">R$ 0,00</strong>
      <small id="taxaInfo"></small>
    </div>
    <button class="btn-finalizar" onclick="abrirCheckout()">Ver Carrinho</button>
  </div>
</div>

<!-- MODAL CARRINHO / CHECKOUT -->
<div class="modal" id="modalCarrinho">
  <div class="modal-box">
    <h2>Seu Pedido</h2>
    <div id="listaCarrinho"></div>
    <form id="formPedido" style="margin-top:16px;">
      <div class="secao-titulo">👤 Seus Dados</div>
      <div class="form-campo"><label>Seu Nome *</label><input type="text" id="nomeCliente" required></div>
      <div class="form-campo"><label>WhatsApp *</label><input type="tel" id="telefoneCliente" required placeholder="(11) 99999-9999"></div>

      <div class="secao-titulo">📍 Endereço de Entrega</div>

      <div class="form-campo">
        <label>Cidade de Entrega *</label>
        <select id="cidadeEntrega" onchange="calcularTotal()">
          <option value="principal">Cidade Principal</option>
        </select>
      </div>

      <div class="linha-grid">
        <div class="form-campo"><label>Rua *</label><input type="text" id="endRua" required></div>
        <div class="form-campo"><label>Número *</label><input type="text" id="endNumero" required></div>
      </div>
      <div class="linha-grid">
        <div class="form-campo"><label>Bairro *</label><input type="text" id="endBairro" required></div>
        <div class="form-campo"><label>Compl.</label><input type="text" id="endComplemento"></div>
      </div>
      <div class="form-campo"><label>Ref.</label><input type="text" id="endReferencia" placeholder="Próximo a..."></div>

      <div class="secao-titulo">💳 Pagamento</div>
      <div class="form-campo">
        <select id="pagamento" required>
          <option value="pix">PIX</option>
          <option value="dinheiro">Dinheiro</option>
          <option value="cartao">Cartão</option>
        </select>
      </div>
      <div id="blocoPix" class="bloco-pix">
        <div class="label-pix">💠 Pagamento via PIX</div>
        <div id="pixConteudo"></div>
      </div>
      <div class="form-campo"><label>Observações</label><textarea id="obs" placeholder="Ex: Sem cebola..."></textarea></div>
      <div class="resumo-total" id="resumoTotal"></div>
      <button type="submit" class="btn-confirmar" id="btnEnviar">Enviar Pedido</button>
      <button type="button" class="btn-voltar" onclick="fecharCheckout()">Voltar</button>
    </form>
  </div>
</div>

<!-- MODAL ACOMPANHAR -->
<div class="modal" id="modalAcompanhar">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0;">Status do Pedido</h2>
      <button onclick="fecharAcompanhamento()" style="background:#f1f5f9; border:0; width:36px; height:36px; border-radius:50%; font-weight:bold; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div class="step-container">
      <div class="step-progress" id="stepProgress"></div>
      <div class="step-item" id="step-1"><div class="step-icon">📝</div><small>Recebido</small></div>
      <div class="step-item" id="step-2"><div class="step-icon">👨‍🍳</div><small>Preparando</small></div>
      <div class="step-item" id="step-3"><div class="step-icon">🛵</div><small>Em Rota</small></div>
      <div class="step-item" id="step-4"><div class="step-icon">✅</div><small>Entregue</small></div>
    </div>
    <div class="info-acompanhar" id="infoAcompanhar">Carregando informações...</div>
    <button class="btn-voltar" onclick="fecharAcompanhamento()">Fechar</button>
  </div>
</div>

<!-- MODAL DETALHE DO PRODUTO -->
<div class="modal modal-detalhe-produto" id="modalDetalheProduto">
  <div class="modal-box">
    <button class="btn-fechar-produto" onclick="fecharDetalheProduto()" aria-label="Fechar">✕</button>
    <input type="hidden" id="detalheProdutoId">
    <div id="detalheProdutoFoto" class="modal-produto-foto"></div>
    <h2 id="detalheProdutoNome"></h2>
    <p id="detalheProdutoDescricao" class="modal-produto-descricao"></p>
    <div id="detalheProdutoPreco" class="modal-produto-preco"></div>
    <div class="modal-produto-qtd">
      <button type="button" onclick="alterarQtdModal(-1)" id="btnQtdMenosModal">−</button>
      <span id="detalheProdutoQtd">0</span>
      <button type="button" onclick="alterarQtdModal(1)" id="btnQtdMaisModal">+</button>
    </div>
    <button type="button" class="btn-add-produto" onclick="adicionarDoModal()">Adicionar ao carrinho</button>
    <button type="button" class="btn-ver-carrinho" onclick="verCarrinhoDoProduto()">Ver carrinho</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  window.addEventListener('error', function(event) {
    const painel = document.getElementById('painelErro');
    if(painel) { painel.style.display = 'block'; painel.innerHTML = `Erro de Script: ${event.message}. Tente recarregar a página.`; }
  });

  const urlParams = new URLSearchParams(window.location.search);
  let comercioId = urlParams.get('loja') || urlParams.get('id');
  let slugAtual = null;

  let produtos = [];
  let carrinho = [];
  let estabelecimento = { nome: '', logo_url: '', endereco: '', cidade: '', estado: '', cidade_vizinha: '', taxa_entrega_vizinha: 0, horario_abertura: '', horario_fechamento: '', taxa_entrega: 0, pedido_minimo: 0, aviso_clientes: '', chave_pix: '', aceita_delivery: true };
  let termoBusca = '';
  let intervalAcompanhamento = null;

  function isUUID(str) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(str || ''));
  }

  async function resolverComercioId(valor) {
    if (!valor) return null;
    if (isUUID(valor)) return valor;
    const { data, error } = await window.supabaseClient
      .from('comercios')
      .select('id, slug')
      .ilike('slug', String(valor).trim())
      .maybeSingle();
    if (error || !data) return null;
    slugAtual = data.slug || null;
    return data.id;
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function gerarId() { return window.crypto?.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); }

  function gerarCodigoRastreio() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    for (let i = 0; i < 8; i++) out += abc[Math.floor(Math.random() * abc.length)];
    return out;
  }

  function fmt(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function mostrarToast(msg, erro) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('erro', !!erro); t.classList.add('visivel'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('visivel'), 2800); }
  function normalizar(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function normalizarTel(t) { return String(t || '').replace(/\D/g, ''); }

  function mostrarErroSistema(msg) {
    const painel = document.getElementById('painelErro');
    painel.style.display = 'block';
    painel.innerHTML = `⚠️ ${esc(msg)}`;
    document.getElementById('nomeEstab').textContent = 'Cardápio Digital';
    document.getElementById('infoEstab').textContent = 'Não foi possível carregar os dados da loja.';
    document.getElementById('gradeProdutos').innerHTML = '<p class="aviso-vazio" style="color:#dc2626;">Não foi possível carregar o cardápio.</p>';
  }

  async function initCardapio() {
    const timer = setTimeout(() => {
      if (document.getElementById('nomeEstab').textContent === 'Carregando...') {
        mostrarErroSistema("O banco de dados está demorando para responder.");
      }
    }, 5000);

    if (!comercioId || comercioId === 'undefined' || comercioId === 'null') {
      clearTimeout(timer);
      return mostrarErroSistema("O link está sem o ID da loja.");
    }

    if (!window.supabaseClient) {
      clearTimeout(timer);
      return mostrarErroSistema("A biblioteca do Supabase não foi encontrada.");
    }

    try {
      const resolvido = await resolverComercioId(comercioId);
      if (!resolvido) {
        clearTimeout(timer);
        return mostrarErroSistema("Loja não encontrada. Verifique o link.");
      }
      comercioId = resolvido;
    } catch (e) {
      clearTimeout(timer);
      return mostrarErroSistema("Erro ao identificar a loja.");
    }

    try {
      const [resCom, resDad] = await Promise.all([
        window.supabaseClient.from('comercios').select('nome, slug').eq('id', comercioId).maybeSingle(),
        window.supabaseClient.from('dados_estabelecimento').select('*').eq('comercio_id', comercioId).maybeSingle()
      ]);

      if (resCom.error) {
         clearTimeout(timer);
         return mostrarErroSistema("O banco bloqueou a leitura. Rode o SQL de permissão (RLS).");
      }

      if (resCom.data?.nome) estabelecimento.nome = resCom.data.nome;
      if (resCom.data?.slug) slugAtual = resCom.data.slug;

      if (resDad.data) {
        estabelecimento = {
          ...estabelecimento,
          logo_url: resDad.data.logo_url || '',
          endereco: resDad.data.endereco || '', cidade: resDad.data.cidade || '', estado: resDad.data.estado || '',
          cidade_vizinha: resDad.data.cidade_vizinha || '', taxa_entrega_vizinha: Number(resDad.data.taxa_entrega_vizinha || 0),
          telefone_whatsapp: resDad.data.telefone_whatsapp || '',
          horario_abertura: resDad.data.horario_abertura || '', horario_fechamento: resDad.data.horario_fechamento || '',
          aberto_manual: resDad.data.aberto_manual !== false, taxa_entrega: Number(resDad.data.taxa_entrega || 0),
          pedido_minimo: Number(resDad.data.pedido_minimo || 0), aceita_delivery: resDad.data.aceita_delivery !== false,
          aviso_clientes: resDad.data.aviso_clientes || '', chave_pix: resDad.data.chave_pix || ''
        };
      }
    } catch (e) {
      clearTimeout(timer);
      return mostrarErroSistema("Erro ao conectar com o banco de dados.");
    }

    renderizarHeader();
    renderizarAvisoLoja();
    configurarCidades();
    preencherDados();

    try {
      const { data, error } = await window.supabaseClient.from('estoque_produtos').select('*').eq('comercio_id', comercioId).gt('quantidade', 0);
      if(error) throw error;
      produtos = data || [];
      renderizarProdutos();
    } catch (e) {
      document.getElementById('gradeProdutos').innerHTML = '<p class="aviso-vazio">Erro ao carregar produtos.</p>';
    } finally {
      clearTimeout(timer);
    }

    const pId = urlParams.get('pedido');
    if (pId) {
      const codigo = pId.trim().toUpperCase();
      document.getElementById('inputRastreio').value = codigo.length <= 8 ? codigo : codigo.slice(0, 8);
      window.abrirAcompanhamento(codigo);
    }
  }

  function configurarCidades() {
    const select = document.getElementById('cidadeEntrega');
    select.innerHTML = `<option value="principal">${esc(estabelecimento.cidade || 'Cidade Principal')}</option>`;
    if (estabelecimento.cidade_vizinha && estabelecimento.taxa_entrega_vizinha > 0) {
      select.innerHTML += `<option value="vizinha">${esc(estabelecimento.cidade_vizinha)} (+ ${fmt(estabelecimento.taxa_entrega_vizinha)})</option>`;
    }
  }

  function estaAbertoAgora() {
    if (estabelecimento.aberto_manual === false || estabelecimento.aceita_delivery === false) return false;
    const { horario_abertura, horario_fechamento } = estabelecimento;
    if (!horario_abertura || !horario_fechamento) return true;
    const agora = new Date();
    const min = agora.getHours() * 60 + agora.getMinutes();
    const [hA, mA] = horario_abertura.split(':').map(Number);
    const [hF, mF] = horario_fechamento.split(':').map(Number);
    const ini = hA * 60 + (mA || 0);
    const fim = hF * 60 + (mF || 0);
    return fim < ini ? (min >= ini || min <= fim) : (min >= ini && min <= fim);
  }

  function renderizarHeader() {
    document.getElementById('nomeEstab').textContent = estabelecimento.nome || 'Cardápio Digital';

    const divLogo = document.querySelector('.logo-estab');
    if (divLogo) {
      if (estabelecimento.logo_url) {
        divLogo.innerHTML = `<img src="${esc(estabelecimento.logo_url)}" style="width:100%; height:100%; object-fit:cover;">`;
      } else {
        divLogo.innerHTML = `🏪`;
      }
    }

    const partes = [];
    const endCompleto = [estabelecimento.endereco, estabelecimento.cidade, estabelecimento.estado].filter(Boolean).join(' - ');
    if (endCompleto) partes.push('📍 ' + esc(endCompleto));
    if (estabelecimento.horario_abertura && estabelecimento.horario_fechamento) partes.push(`🕐 De ${esc(estabelecimento.horario_abertura)} às ${esc(estabelecimento.horario_fechamento)}`);

    if (estabelecimento.taxa_entrega > 0) partes.push(`🛵 Taxa de entrega: <strong>${fmt(estabelecimento.taxa_entrega)}</strong>`);
    else partes.push('🛵 <strong>Entrega Grátis!</strong>');

    document.getElementById('infoEstab').innerHTML = partes.join('<br>');

    const badge = document.getElementById('badgeStatus');
    const aberto = estaAbertoAgora();
    badge.style.display = 'inline-block';
    badge.textContent = aberto ? '🟢 Aberto agora' : '🔴 Fechado';
    badge.classList.toggle('fechado', !aberto);

    if (!aberto) document.getElementById('avisoFechado').innerHTML = '<div style="background:#fee2e2;color:#991b1b;padding:12px;text-align:center;font-weight:800;font-size:13px;border-radius:12px;margin-bottom:16px;">😴 A loja está fechada no momento.</div>';
    else document.getElementById('avisoFechado').innerHTML = '';
  }

  function renderizarAvisoLoja() {
    const el = document.getElementById('avisoLoja');
    const aviso = (estabelecimento.aviso_clientes || '').trim();
    if (!aviso) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="aviso-loja"><div class="aviso-loja-titulo">📢 Aviso da Loja</div><div class="aviso-loja-texto">${esc(aviso)}</div></div>`;
  }

  function renderizarProdutos() {
    const grade = document.getElementById('gradeProdutos');
    const t = normalizar(termoBusca);
    const lista = !t ? produtos : produtos.filter(p => normalizar(p.nome).includes(t) || normalizar(p.descricao || '').includes(t));
    if (!produtos.length) return grade.innerHTML = '<p class="aviso-vazio">Nenhum produto disponível.</p>';
    if (!lista.length) return grade.innerHTML = `<p class="aviso-vazio">Nada encontrado.</p>`;

    grade.innerHTML = lista.map(p => {
      const noCarrinho = carrinho.find(c => String(c.id) === String(p.id));
      const qtd = noCarrinho ? noCarrinho.quantidade : 0;
      return `
        <div class="produto" onclick="abrirDetalheProduto('${esc(String(p.id))}')">
          ${p.foto ? `<img src="${esc(p.foto)}" class="foto" alt="">` : `<div class="foto">🍔</div>`}
          <div class="nome">${esc(p.nome)}</div>
          ${p.descricao ? `<div class="descricao">${esc(p.descricao)}</div>` : ''}
          <div class="preco">${fmt(p.preco)}</div>
          <div class="controle" onclick="event.stopPropagation()">
            <button onclick="event.stopPropagation(); alterarQtd('${esc(String(p.id))}', -1)" ${qtd === 0 ? 'disabled' : ''}>−</button>
            <span class="qtd">${qtd}</span>
            <button onclick="event.stopPropagation(); alterarQtd('${esc(String(p.id))}', 1)" ${qtd >= p.quantidade ? 'disabled' : ''}>+</button>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('buscaProduto').addEventListener('input', (e) => {
    termoBusca = e.target.value.trim();
    document.getElementById('btnLimparBusca').classList.toggle('visivel', !!termoBusca);
    renderizarProdutos();
  });
  window.limparBusca = function () { termoBusca = ''; document.getElementById('buscaProduto').value = ''; document.getElementById('btnLimparBusca').classList.remove('visivel'); renderizarProdutos(); };

  window.alterarQtd = function (id, delta) {
    const prod = produtos.find(p => String(p.id) === String(id));
    let item = carrinho.find(c => String(c.id) === String(id));
    if (!item && delta > 0) carrinho.push({ ...prod, quantidade: 1 });
    else if (item) {
      item.quantidade += delta;
      if (item.quantidade <= 0) carrinho = carrinho.filter(c => String(c.id) !== String(id));
      else if (item.quantidade > prod.quantidade) item.quantidade = prod.quantidade;
    }
    calcularTotal(); renderizarProdutos();
    if (document.getElementById('modalCarrinho').classList.contains('aberto')) abrirCheckout();
  };
  window.removerItem = function (id) { carrinho = carrinho.filter(c => String(c.id) !== String(id)); calcularTotal(); renderizarProdutos(); abrirCheckout(); };

  // MODAL DETALHE DO PRODUTO
  window.abrirDetalheProduto = function (id) {
    const p = produtos.find(x => String(x.id) === String(id));
    if (!p) return;

    document.getElementById('detalheProdutoId').value = p.id;
    document.getElementById('detalheProdutoNome').textContent = p.nome;
    document.getElementById('detalheProdutoPreco').textContent = fmt(p.preco);

    const descEl = document.getElementById('detalheProdutoDescricao');
    const descTexto = (p.descricao || '').trim();
    descEl.textContent = descTexto || 'Sem descrição disponível.';
    descEl.style.display = 'block';

    const fotoEl = document.getElementById('detalheProdutoFoto');
    if (p.foto) {
      fotoEl.innerHTML = `<img src="${esc(p.foto)}" style="width:100%;height:100%;object-fit:cover;" alt="">`;
    } else {
      fotoEl.innerHTML = `🍔`;
    }

    atualizarQtdModal();
    document.getElementById('modalDetalheProduto').classList.add('aberto');
  };

  window.fecharDetalheProduto = function () {
    document.getElementById('modalDetalheProduto').classList.remove('aberto');
  };

  function atualizarQtdModal() {
    const id = document.getElementById('detalheProdutoId').value;
    if (!id) return;
    const item = carrinho.find(c => String(c.id) === String(id));
    const prod = produtos.find(p => String(p.id) === String(id));
    const qtd = item ? item.quantidade : 0;

    document.getElementById('detalheProdutoQtd').textContent = qtd;
    document.getElementById('btnQtdMenosModal').disabled = (qtd === 0);
    document.getElementById('btnQtdMaisModal').disabled = (prod && qtd >= prod.quantidade);
  }

  window.alterarQtdModal = function (delta) {
    const id = document.getElementById('detalheProdutoId').value;
    if (!id) return;
    alterarQtd(id, delta);
    atualizarQtdModal();
  };

  window.adicionarDoModal = function () {
    const id = document.getElementById('detalheProdutoId').value;
    if (!id) return;
    const item = carrinho.find(c => String(c.id) === String(id));
    if (!item) alterarQtd(id, 1);
    atualizarQtdModal();
    mostrarToast('Adicionado ao carrinho! 🛒');
  };

  window.verCarrinhoDoProduto = function () {
    fecharDetalheProduto();
    abrirCheckout();
  };

  function calcularSubtotal() { return carrinho.reduce((acc, c) => acc + Number(c.preco) * c.quantidade, 0); }

  function calcularTaxa() {
    if (calcularSubtotal() === 0) return 0;
    const selectCidade = document.getElementById('cidadeEntrega');
    const cidadeSelecionada = selectCidade ? selectCidade.value : 'principal';
    if (cidadeSelecionada === 'vizinha') {
      return Number(estabelecimento.taxa_entrega_vizinha || 0);
    }
    return Number(estabelecimento.taxa_entrega || 0);
  }

  function calcularTotal() {
    const sub = calcularSubtotal();
    const taxa = calcularTaxa();
    const total = sub + taxa;

    const qtd = carrinho.reduce((acc, c) => acc + c.quantidade, 0);
    const bar = document.getElementById('carrinhoBar');
    if (qtd > 0) {
      bar.classList.add('visivel');
      document.getElementById('qtdCarrinho').textContent = `${qtd} ${qtd === 1 ? 'item' : 'itens'}`;
      document.getElementById('totalCarrinho').textContent = fmt(total);
      document.getElementById('taxaInfo').textContent = taxa > 0 ? `(inclui taxa de ${fmt(taxa)})` : '';
    } else { bar.classList.remove('visivel'); }

    if (document.getElementById('modalCarrinho').classList.contains('aberto')) {
      document.getElementById('resumoTotal').innerHTML = `
        <div class="linha"><span>Subtotal</span><span>${fmt(sub)}</span></div>
        <div class="linha"><span>Taxa de entrega</span><span>${taxa > 0 ? fmt(taxa) : 'Grátis'}</span></div>
        <div class="linha"><span>Total</span><span>${fmt(total)}</span></div>
        ${estabelecimento.pedido_minimo > 0 && sub < estabelecimento.pedido_minimo ? `<div style="color:#dc2626;font-size:11px;font-weight:800;margin-top:8px;">⚠️ Mínimo: ${fmt(estabelecimento.pedido_minimo)}</div>` : ''}
      `;
      document.getElementById('btnEnviar').disabled = (!carrinho.length || (estabelecimento.pedido_minimo > 0 && sub < estabelecimento.pedido_minimo));
    }
    return total;
  }

  function abrirCheckout() {
    const lista = document.getElementById('listaCarrinho');
    lista.innerHTML = carrinho.length ? carrinho.map(c => `
      <div class="item-carrinho">
        <div><strong>${esc(c.nome)}</strong><br><span>${fmt(c.preco * c.quantidade)}</span></div>
        <div class="mini-controle">
          <button onclick="alterarQtd('${esc(String(c.id))}', -1)">−</button><span>${c.quantidade}</span><button onclick="alterarQtd('${esc(String(c.id))}', 1)">+</button>
          <button class="remover" onclick="removerItem('${esc(String(c.id))}')">✕</button>
        </div>
      </div>`).join('') : '<p style="text-align:center;color:#64748b;">Carrinho vazio</p>';

    calcularTotal();
    document.getElementById('modalCarrinho').classList.add('aberto');
  }
  window.fecharCheckout = function () { document.getElementById('modalCarrinho').classList.remove('aberto'); };

  function atualizarBlocoPix() {
    const pag = document.getElementById('pagamento').value, bloco = document.getElementById('blocoPix');
    if (pag !== 'pix') { bloco.style.display = 'none'; return; }
    bloco.style.display = 'block';

    if (estabelecimento.chave_pix) {
      const chave = String(estabelecimento.chave_pix);
      document.getElementById('pixConteudo').innerHTML = `
        <div class="chave-pix">${esc(chave)}</div>
        <button type="button" class="btn-copiar-pix" id="btnCopiarPix">📋 Copiar chave PIX</button>
        <div class="aviso-pix">⚠️ Seu pedido só será <strong>aceito após a confirmação do pagamento</strong>.</div>
      `;
      const btn = document.getElementById('btnCopiarPix');
      if (btn) btn.addEventListener('click', () => {
        navigator.clipboard.writeText(chave).then(() => mostrarToast('Copiada!')).catch(() => mostrarToast('Erro ao copiar', true));
      });
    } else {
      document.getElementById('pixConteudo').innerHTML = `<div class="aviso-pix">💡 A loja não cadastrou a chave PIX.</div>`;
    }
  }
  document.getElementById('pagamento').addEventListener('change', atualizarBlocoPix);

  function preencherDados() {
    try {
      const info = JSON.parse(localStorage.getItem('drTroco_cliente_info') || '{}');
      ['nome', 'telefone', 'rua', 'numero', 'bairro', 'complemento', 'referencia'].forEach(k => {
        if (info[k]) document.getElementById(k === 'nome' ? 'nomeCliente' : k === 'telefone' ? 'telefoneCliente' : 'end' + k.charAt(0).toUpperCase() + k.slice(1)).value = info[k];
      });
    } catch(e){}
  }
  function salvarDados() {
    try {
      localStorage.setItem('drTroco_cliente_info', JSON.stringify({
        nome: document.getElementById('nomeCliente').value.trim(),
        telefone: document.getElementById('telefoneCliente').value.trim(),
        rua: document.getElementById('endRua').value.trim(), numero: document.getElementById('endNumero').value.trim(),
        bairro: document.getElementById('endBairro').value.trim(), complemento: document.getElementById('endComplemento').value.trim(),
        referencia: document.getElementById('endReferencia').value.trim()
      }));
    } catch(e){}
  }

  function formatarEndereco() {
    const rua = document.getElementById('endRua').value.trim(), num = document.getElementById('endNumero').value.trim();
    const bai = document.getElementById('endBairro').value.trim(), com = document.getElementById('endComplemento').value.trim();
    const ref = document.getElementById('endReferencia').value.trim();

    const selectCidade = document.getElementById('cidadeEntrega');
    const cidadeEscolhida = (selectCidade && selectCidade.selectedIndex >= 0)
      ? selectCidade.options[selectCidade.selectedIndex].text.split(' (')[0]
      : (estabelecimento.cidade || 'Cidade Principal');

    if (!rua || !num || !bai) return '';
    return `${rua}, ${num} - ${bai} (${cidadeEscolhida})${com ? ` (${com})` : ''}${ref ? ` — Ref: ${ref}` : ''}`;
  }

  document.getElementById('formPedido').addEventListener('submit', async (e) => {
    e.preventDefault();
    const endereco = formatarEndereco();
    if (!endereco) return mostrarToast('Preencha o endereço completo.', true);
    const tel = normalizarTel(document.getElementById('telefoneCliente').value);
    if (tel.length < 10) return mostrarToast('WhatsApp inválido.', true);

    const btn = document.getElementById('btnEnviar');
    btn.textContent = 'Enviando...'; btn.disabled = true;

    const trackingCode = gerarCodigoRastreio();

    const pedido = {
      id: gerarId(), comercio_id: comercioId, mesa_nome: 'Delivery', codigo_qr: 'DELIVERY',
      tracking_code: trackingCode,
      cliente_nome: document.getElementById('nomeCliente').value.trim(), cliente_telefone: tel, endereco_entrega: endereco,
      itens: carrinho.map(c => ({ id: c.id, nome: c.nome, quantidade: c.quantidade, valorUnitarioCentavos: Math.round(c.preco * 100) })),
      total: calcularTotal(), taxa_entrega: calcularTaxa(),
      status: 'aberta', forma_pagamento: document.getElementById('pagamento').value, origem: 'cardapio',
      observacao: document.getElementById('obs').value.trim(), atualizado_em: new Date().toISOString()
    };

    try {
      const { error } = await window.supabaseClient.from('comandas_abertas').insert([pedido]);
      if (error) throw error;

      localStorage.setItem('drTroco_ultimo_pedido', pedido.id);
      salvarDados();

      const identificadorLoja = slugAtual || comercioId;
      const linkRastreio = window.location.origin + window.location.pathname + '?loja=' + encodeURIComponent(identificadorLoja) + '&pedido=' + encodeURIComponent(trackingCode);
      const msg = encodeURIComponent(`Olá ${pedido.cliente_nome}! Seu pedido *${trackingCode}* foi recebido.\n\nPara acompanhar o status, clique no link abaixo:\n${linkRastreio}`);
      window.open(`https://wa.me/55${tel}?text=${msg}`, '_blank');

      if (estabelecimento.telefone_whatsapp) {
        setTimeout(() => window.open(`https://wa.me/55${normalizarTel(estabelecimento.telefone_whatsapp)}?text=${encodeURIComponent(`🛵 NOVO PEDIDO ${trackingCode}\nCliente: ${pedido.cliente_nome}\nTotal: ${fmt(pedido.total)}`)}`, '_blank'), 800);
      }

      mostrarToast('Pedido enviado! 🛵');
      carrinho = []; calcularTotal(); renderizarProdutos(); fecharCheckout(); document.getElementById('formPedido').reset(); atualizarBlocoPix(); preencherDados();
      window.abrirAcompanhamento(trackingCode);
    } catch (err) {
      console.error(err); mostrarToast('Erro ao enviar. Tente novamente.', true);
    } finally {
      btn.textContent = 'Enviar Pedido'; btn.disabled = false;
    }
  });

  window.rastrearPedidoManual = function() {
    let code = document.getElementById('inputRastreio').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) return mostrarToast('Digite o código de rastreio.', true);
    window.abrirAcompanhamento(code);
  };

  window.abrirAcompanhamento = async function(idOuCode) {
    document.getElementById('modalAcompanhar').classList.add('aberto');
    if (intervalAcompanhamento) clearInterval(intervalAcompanhamento);

    idOuCode = String(idOuCode || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();

    if (!idOuCode) {
      document.getElementById('infoAcompanhar').innerHTML = `<span style="color:#dc2626;">Código inválido.</span>`;
      return;
    }

    let idFinal = null;

    if (idOuCode.length >= 32) {
      const { data, error } = await window.supabaseClient
        .from('comandas_abertas')
        .select('id')
        .eq('id', idOuCode.toLowerCase())
        .eq('comercio_id', comercioId)
        .maybeSingle();

      if (error || !data) {
        document.getElementById('infoAcompanhar').innerHTML = `<span style="color:#dc2626;">Pedido não encontrado.</span>`;
        return;
      }
      idFinal = data.id;
    } else {
      document.getElementById('infoAcompanhar').innerHTML = 'Buscando pedido...';
      const { data, error } = await window.supabaseClient.rpc('buscar_pedido_por_codigo', {
        p_comercio_id: comercioId,
        p_codigo: idOuCode
      });

      if (error || !data || !data.length) {
        document.getElementById('infoAcompanhar').innerHTML = `<span style="color:#dc2626;">Pedido não encontrado. Verifique o código.</span>`;
        return;
      }
      idFinal = data[0].pedido_id;
    }

    atualizarStatusPedido(idFinal);
    intervalAcompanhamento = setInterval(() => atualizarStatusPedido(idFinal), 5000);
  };

  window.fecharAcompanhamento = function() {
    document.getElementById('modalAcompanhar').classList.remove('aberto');
    if (intervalAcompanhamento) clearInterval(intervalAcompanhamento);
  };

  async function atualizarStatusPedido(id) {
    try {
      const { data } = await window.supabaseClient
        .from('comandas_abertas')
        .select('status, total')
        .eq('id', id)
        .eq('comercio_id', comercioId)
        .maybeSingle();

      if (!data) {
        document.getElementById('infoAcompanhar').innerHTML = `<span style="color:#dc2626;">Pedido não encontrado.</span>`;
        if (intervalAcompanhamento) clearInterval(intervalAcompanhamento);
        return;
      }

      const info = document.getElementById('infoAcompanhar'), prog = document.getElementById('stepProgress');
      const steps = ['step-1', 'step-2', 'step-3', 'step-4'];
      steps.forEach(s => document.getElementById(s).classList.remove('ativo'));

      let stepAtual = 1, texto = '';
      if (data.status === 'aberta') { stepAtual = 1; texto = 'Aguardando a loja aceitar seu pedido...'; }
      else if (data.status === 'preparando') { stepAtual = 2; texto = 'Seu pedido está sendo preparado com carinho!'; }
      else if (data.status === 'em_rota') { stepAtual = 3; texto = 'O entregador já está a caminho! Fique atento.'; }
      else if (data.status === 'fechada') { stepAtual = 4; texto = 'Pedido entregue. Bom apetite!'; }
      else if (data.status === 'cancelado') { stepAtual = 0; texto = 'Infelizmente este pedido foi cancelado.'; }

      for(let i=1; i<=stepAtual; i++) document.getElementById('step-'+i).classList.add('ativo');
      prog.style.width = stepAtual === 1 ? '0%' : stepAtual === 2 ? '33%' : stepAtual === 3 ? '66%' : stepAtual === 4 ? '100%' : '0%';

      if (stepAtual === 0) { prog.style.background = '#dc2626'; info.style.color = '#dc2626'; }
      else { prog.style.background = '#10b981'; info.style.color = '#334155'; }
      info.innerHTML = `<strong>Status:</strong> ${esc(texto)}<br><br><strong>Total do Pedido:</strong> ${fmt(data.total)}`;
      if (data.status === 'fechada' || data.status === 'cancelado') clearInterval(intervalAcompanhamento);
    } catch(e) {}
  }

  window.addEventListener('DOMContentLoaded', () => { setTimeout(initCardapio, 200); });
  setInterval(renderizarHeader, 60000);
</script>
</body>
</html>
