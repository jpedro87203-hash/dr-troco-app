<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardápio Digital - Dr. Troco</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f7f5; margin: 0; padding-bottom: 90px; color: #263640; }
    .header { background: #168b53; color: #fff; padding: 20px 16px; border-radius: 0 0 20px 20px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header h1 { margin: 0; font-size: 22px; font-weight: 900; }
    .header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 500px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    
    .produto { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
    .produto .foto { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .produto .nome { font-size: 13px; font-weight: 800; margin: 8px 0 2px; height: 36px; overflow: hidden; }
    .produto .preco { font-size: 15px; font-weight: 900; color: #168b53; margin-bottom: 8px; }
    .produto button { background: #eaf8f0; color: #147844; border: 0; border-radius: 8px; padding: 10px; font-weight: 900; cursor: pointer; margin-top: auto; width: 100%; }
    .produto button:active { background: #d1f2e0; }
    
    /* Carrinho Flutuante */
    .carrinho-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; box-shadow: 0 -4px 15px rgba(0,0,0,0.08); display: none; align-items: center; justify-content: space-between; z-index: 20; }
    .carrinho-info { display: flex; flex-direction: column; }
    .carrinho-info span { font-size: 12px; color: #64748b; font-weight: bold; }
    .carrinho-info strong { font-size: 18px; color: #1f3028; }
    .btn-finalizar { background: #168b53; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-weight: 900; font-size: 15px; cursor: pointer; }
    
    /* Modal do Carrinho */
    .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 30; display: none; align-items: flex-end; }
    .modal.aberto { display: flex; }
    .modal-box { background: #fff; width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; box-sizing: border-box; }
    .item-carrinho { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
    .item-carrinho button { background: #fff0f0; color: #d94b4b; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: bold; cursor: pointer; }
    .form-campo { margin-bottom: 12px; }
    .form-campo label { display: block; font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 4px; }
    .form-campo input, .form-campo select, .form-campo textarea { width: 100%; height: 46px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0 12px; font-size: 14px; box-sizing: border-box; outline: none; }
    .form-campo textarea { height: 70px; padding: 10px 12px; resize: none; }
    .btn-confirmar { width: 100%; background: #168b53; color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 900; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

<div class="header">
  <h1>🍔 Cardápio Digital</h1>
  <p>Faça seu pedido e receba em casa!</p>
</div>

<div class="container">
  <div id="gradeProdutos" class="grade">
    <p style="text-align:center;width:100%;grid-column:1/-1;">Carregando cardápio...</p>
  </div>
</div>

<!-- Barra do Carrinho -->
<div class="carrinho-bar" id="carrinhoBar">
  <div class="carrinho-info">
    <span id="qtdCarrinho">0 itens</span>
    <strong id="totalCarrinho">R$ 0,00</strong>
  </div>
  <button class="btn-finalizar" onclick="abrirCheckout()">Ver Carrinho</button>
</div>

<!-- Modal: Carrinho e Checkout -->
<div class="modal" id="modalCarrinho">
  <div class="modal-box">
    <h2 style="margin:0 0 16px; font-size:20px;">Seu Pedido</h2>
    <div id="listaCarrinho"></div>
    
    <form id="formPedido" style="margin-top:20px;">
      <div class="form-campo">
        <label>Seu Nome *</label>
        <input type="text" id="nomeCliente" required placeholder="Ex: João Silva">
      </div>
      <div class="form-campo">
        <label>Forma de Pagamento *</label>
        <select id="pagamento" required>
          <option value="pix">PIX</option>
          <option value="dinheiro">Dinheiro (na entrega)</option>
          <option value="cartao">Cartão (na entrega)</option>
        </select>
      </div>
      <div class="form-campo">
        <label>Observações (opcional)</label>
        <textarea id="obs" placeholder="Ex: Sem cebola, troco para R$50..."></textarea>
      </div>
      <button type="submit" class="btn-confirmar" id="btnEnviar">Enviar Pedido</button>
      <button type="button" onclick="fecharCheckout()" style="width:100%; background:transparent; border:0; margin-top:12px; color:#64748b; font-weight:bold; padding:10px; cursor:pointer;">Voltar ao cardápio</button>
    </form>
  </div>
</div>

<script>
  // O link do cardápio deve ser: cardapio.html?loja=ID_DA_LOJA
  const urlParams = new URLSearchParams(window.location.search);
  const comercioId = urlParams.get('loja'); 
  let produtos = [];
  let carrinho = [];

  async function carregarCardapio() {
    if (!comercioId) {
      document.getElementById('gradeProdutos').innerHTML = '<p style="text-align:center;width:100%;grid-column:1/-1;color:red;">Link inválido. Faltou o ID da loja.</p>';
      return;
    }

    try {
      // Puxa os produtos do Supabase - CORRIGIDO PARA 'estoque_produtos'
      const { data, error } = await window.supabaseClient
        .from('estoque_produtos') 
        .select('*')
        .eq('comercio_id', comercioId)
        .gt('quantidade', 0); // Só mostra o que tem estoque

      if (error) throw error;
      produtos = data || [];
      renderizarProdutos();
    } catch (e) {
      console.error(e);
      document.getElementById('gradeProdutos').innerHTML = '<p style="text-align:center;width:100%;grid-column:1/-1;color:red;">Erro ao carregar o cardápio.</p>';
    }
  }

  function renderizarProdutos() {
    const grade = document.getElementById('gradeProdutos');
    if (!produtos.length) {
      grade.innerHTML = '<p style="text-align:center;width:100%;grid-column:1/-1;">Nenhum produto disponível no momento.</p>';
      return;
    }
    
    grade.innerHTML = produtos.map(p => `
      <div class="produto">
        ${p.foto ? `<img src="${p.foto}" class="foto">` : `<div class="foto">🍔</div>`}
        <div class="nome">${p.nome}</div>
        <div class="preco">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</div>
        <button onclick="adicionarAoCarrinho('${p.id}')">+ Adicionar</button>
      </div>
    `).join('');
  }

  function adicionarAoCarrinho(id) {
    const prod = produtos.find(p => String(p.id) === String(id));
    if (!prod) return;
    
    const noCarrinho = carrinho.find(c => String(c.id) === String(id));
    if (noCarrinho) {
      noCarrinho.quantidade++;
    } else {
      carrinho.push({ ...prod, quantidade: 1 });
    }
    atualizarCarrinho();
  }

  function atualizarCarrinho() {
    const bar = document.getElementById('carrinhoBar');
    const qtd = carrinho.reduce((acc, c) => acc + c.quantidade, 0);
    const total = carrinho.reduce((acc, c) => acc + (c.preco * c.quantidade), 0);
    
    if (qtd > 0) {
      bar.style.display = 'flex';
      document.getElementById('qtdCarrinho').textContent = `${qtd} itens`;
      document.getElementById('totalCarrinho').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
    } else {
      bar.style.display = 'none';
    }
  }

  function abrirCheckout() {
    const lista = document.getElementById('listaCarrinho');
    lista.innerHTML = carrinho.map(c => `
      <div class="item-carrinho">
        <div>
          <strong style="display:block;font-size:14px;">${c.quantidade}x ${c.nome}</strong>
          <span style="font-size:12px;color:#64748b;">R$ ${(c.preco * c.quantidade).toFixed(2).replace('.', ',')}</span>
        </div>
        <button onclick="removerDoCarrinho('${c.id}')">Remover</button>
      </div>
    `).join('');
    document.getElementById('modalCarrinho').classList.add('aberto');
  }

  function fecharCheckout() {
    document.getElementById('modalCarrinho').classList.remove('aberto');
  }

  function removerDoCarrinho(id) {
    carrinho = carrinho.filter(c => String(c.id) !== String(id));
    atualizarCarrinho();
    abrirCheckout(); // Atualiza a tela
  }

  document.getElementById('formPedido').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!carrinho.length) return alert('O carrinho está vazio.');

    const btn = document.getElementById('btnEnviar');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    const nome = document.getElementById('nomeCliente').value;
    const pagamento = document.getElementById('pagamento').value;
    const obs = document.getElementById('obs').value;
    const total = carrinho.reduce((acc, c) => acc + (c.preco * c.quantidade), 0);

    const itensFormatados = carrinho.map(c => ({
      id: c.id,
      nome: c.nome,
      quantidade: c.quantidade,
      valorUnitarioCentavos: Math.round(c.preco * 100)
    }));

    const pedido = {
      id: crypto.randomUUID(),
      comercio_id: comercioId,
      mesa_nome: 'Delivery Online',
      codigo_qr: 'DELIVERY',
      cliente_nome: nome,
      itens: itensFormatados,
      total: total,
      status: 'aberta',
      forma_pagamento: pagamento,
      origem: 'cardapio',
      observacao: obs,
      atualizado_em: new Date().toISOString()
    };

    try {
      const { error } = await window.supabaseClient.from('comandas_abertas').insert([pedido]);
      if (error) throw error;

      alert('Pedido enviado com sucesso! A loja já foi notificada. 🛵');
      carrinho = [];
      atualizarCarrinho();
      fecharCheckout();
      document.getElementById('formPedido').reset();
    } catch (err) {
      alert('Erro ao enviar o pedido. Tente novamente.');
      console.error(err);
    } finally {
      btn.textContent = 'Enviar Pedido';
      btn.disabled = false;
    }
  });

  carregarCardapio();
</script>
</body>
</html>
