<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cardápio Digital - Dr. Troco</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    :root { --verde:#168b53; --verde-claro:#eaf8f0; --texto:#263640; --cinza:#64748b; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f7f5; margin: 0; padding-bottom: 110px; color: var(--texto); }

    /* HEADER */
    .header { background: linear-gradient(135deg, #168b53, #0f6b3f); color: #fff; padding: 16px 16px 20px; border-radius: 0 0 22px 22px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,.12); }
    .header-topo { display: flex; align-items: flex-start; gap: 12px; }
    .logo-estab { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    .info-estab { flex: 1; min-width: 0; }
    .info-estab h1 { margin: 0; font-size: 18px; font-weight: 900; line-height: 1.2; word-break: break-word; }
    .info-estab p { margin: 4px 0 0; font-size: 12px; opacity: .92; line-height: 1.4; }
    .badge-status { display: inline-block; margin-top: 7px; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 900; background: rgba(255,255,255,.22); }
    .badge-status.fechado { background: #dc2626; }

    /* BUSCA */
    .barra-busca { margin-top: 14px; display: flex; gap: 8px; }
    .barra-busca input { flex: 1; height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font-size: 14px; outline: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .btn-limpar { width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(255,255,255,.22); color: #fff; font-size: 18px; cursor: pointer; display: none; }
    .btn-limpar.visivel { display: flex; align-items: center; justify-content: center; }

    .container { max-width: 640px; margin: 0 auto; padding: 16px; }

    /* AVISO DO LOJISTA */
    .aviso-loja { background: #fff7ed; border-left: 4px solid #ea580c; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .aviso-loja-titulo { font-size: 13px; font-weight: 900; color: #c2410c; margin-bottom: 4px; }
    .aviso-loja-texto { font-size: 13px; color: #7c2d12; line-height: 1.5; font-weight: 600; white-space: pre-line; }

    /* GRID PRODUTOS */
    .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 500px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    .produto { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.04); display: flex; flex-direction: column; text-align: center; }
    .produto .foto { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .produto .nome { font-size: 13px; font-weight: 800; margin: 8px 0 4px; height: 36px; overflow: hidden; line-height: 1.3; }
    .produto .preco { font-size: 15px; font-weight: 900; color: var(--verde); margin-bottom: 8px; }

    .controle { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: auto; }
    .controle button { width: 34px; height: 34px; border: 0; border-radius: 9px; background: var(--verde-claro); color: var(--verde); font-size: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .controle button:active { background: #d1f2e0; }
    .controle button:disabled { opacity: .35; cursor: not-allowed; }
    .controle .qtd { min-width: 24px; text-align: center; font-weight: 900; font-size: 14px; }

    .aviso-vazio { text-align: center; padding: 40px 16px; color: var(--cinza); grid-column: 1/-1; }

    /* BARRA CARRINHO */
    .carrinho-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 15px rgba(0,0,0,.1); display: none; align-items: center; justify-content: space-between; z-index: 20; gap: 10px; }
    .carrinho-bar.visivel { display: flex; }
    .carrinho-info { flex: 1; min-width: 0; }
    .carrinho-info span { font-size: 11px; color: var(--cinza); font-weight: bold; display: block; }
    .carrinho-info strong { font-size: 17px; color: #1f3028; display: block; }
    .carrinho-info small { font-size: 10px; color: var(--cinza); display: block; margin-top: 2px; }
    .btn-finalizar { background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 900; font-size: 14px; cursor: pointer; white-space: nowrap; }

    /* MODAL */
    .modal { position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 30; display: none; align-items: flex-end; }
    .modal.aberto { display: flex; }
    .modal-box { background: #fff; width: 100%; max-height: 92vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; }
    .modal-box h2 { margin: 0 0 16px; font-size: 20px; }

    .secao-titulo { font-size: 12px; font-weight: 900; color: var(--verde); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px; padding-top: 6px; border-top: 1px dashed #e2e8f0; }
    .secao-titulo:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }

    .item-carrinho { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; gap: 10px; }
    .item-carrinho > div { min-width: 0; }
    .item-carrinho strong { display: block; font-size: 13px; }
    .item-carrinho span { font-size: 12px; color: var(--cinza); }
    .mini-controle { display: flex; align-items: center; gap: 4px; }
    .mini-controle button { width: 28px; height: 28px; border: 0; border-radius: 7px; font-weight: 900; font-size: 15px; cursor: pointer; background: var(--verde-claro); color: var(--verde); }
    .mini-controle .remover { background: #fff0f0; color: #d94b4b; }

    .form-campo { margin-bottom: 12px; }
    .form-campo label { display: block; font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 4px; }
    .form-campo input, .form-campo select, .form-campo textarea { width: 100%; height: 46px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0 12px; font-size: 14px; outline: none; }
    .form-campo textarea { height: 70px; padding: 10px 12px; resize: none; }
    .form-campo input:focus, .form-campo select:focus, .form-campo textarea:focus { border-color: var(--verde); }

    .linha-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

    /* BLOCO PIX */
    .bloco-pix { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .bloco-pix .label-pix { font-size: 12px; font-weight: 900; color: #0369a1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .bloco-pix .chave-pix { background: #fff; border: 1px solid #e0f2fe; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 13px; word-break: break-all; color: #0c4a6e; font-weight: 700; }
    .bloco-pix .btn-copiar-pix { background: #0284c7; color: #fff; border: 0; border-radius: 8px; padding: 10px; font-weight: 900; font-size: 13px; cursor: pointer; margin-top: 8px; width: 100%; }
    .bloco-pix .aviso-pix { font-size: 12px; color: #b45309; background: #fef3c7; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: 700; line-height: 1.45; }

    .resumo-total { background: #f8fafc; border-radius: 12px; padding: 12px; margin: 12px 0; font-size: 13px; }
    .resumo-total .linha { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .resumo-total .linha:last-child { margin-bottom: 0; font-size: 16px; font-weight: 900; border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: 8px; }
    .aviso-minimo { color: #dc2626; font-size: 11px; font-weight: 800; margin-top: 8px; }

    .btn-confirmar { width: 100%; background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 900; margin-top: 10px; cursor: pointer; }
    .btn-confirmar:disabled { opacity: .6; cursor: not-allowed; }
    .btn-voltar { width: 100%; background: transparent; border: 0; margin-top: 10px; color: var(--cinza); font-weight: bold; padding: 10px; cursor: pointer; }

    /* TOAST */
    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-120px); background: #1f3028; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 800; z-index: 100; transition: transform .3s; box-shadow: 0 8px 20px rgba(0,0,0,.2); max-width: 90%; text-align: center; }
    .toast.visivel { transform: translateX(-50%) translateY(0); }
    .toast.erro { background: #dc2626; }

    .estab-fechado-aviso { background: #fee2e2; color: #991b1b; padding: 12px 16px; text-align: center; font-weight: 800; font-size: 13px; border-radius: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="header" id="headerEstab">
  <div class="header-topo">
    <div class="logo-estab">🏪</div>
    <div class="info-estab">
      <h1 id="nomeEstab">Carregando...</h1>
      <p id="infoEstab"></p>
      <span class="badge-status" id="badgeStatus" style="display:none;"></span>
    </div>
  </div>
  <div class="barra-busca">
    <input type="text" id="buscaProduto" placeholder="🔍 Pesquisar produto..." autocomplete="off">
    <button class="btn-limpar" id="btnLimparBusca" onclick="limparBusca()">✕</button>
  </div>
</div>

<div class="container">
  <div id="avisoFechado"></div>
  <div id="avisoLoja"></div>
  <div id="gradeProdutos" class="grade">
    <p class="aviso-vazio">Carregando cardápio...</p>
  </div>
</div>

<div class="carrinho-bar" id="carrinhoBar">
  <div class="carrinho-info">
    <span id="qtdCarrinho">0 itens</span>
    <strong id="totalCarrinho">R$ 0,00</strong>
    <small id="taxaInfo"></small>
  </div>
  <button class="btn-finalizar" onclick="abrirCheckout()">Ver Carrinho</button>
</div>

<div class="modal" id="modalCarrinho">
  <div class="modal-box">
    <h2>Seu Pedido</h2>
    <div id="listaCarrinho"></div>

    <form id="formPedido" style="margin-top:16px;">

      <div class="secao-titulo">👤 Seus Dados</div>
      <div class="form-campo">
        <label>Seu Nome *</label>
        <input type="text" id="nomeCliente" required placeholder="Ex: João Silva">
      </div>
      <div class="form-campo">
        <label>WhatsApp (para atualizações) *</label>
        <input type="tel" id="telefoneCliente" required placeholder="(11) 99999-9999" inputmode="tel">
      </div>

      <div class="secao-titulo">📍 Endereço de Entrega</div>
      <div class="linha-grid">
        <div class="form-campo">
          <label>Rua / Avenida *</label>
          <input type="text" id="endRua" required placeholder="Ex: Rua das Flores">
        </div>
        <div class="form-campo">
          <label>Número *</label>
          <input type="text" id="endNumero" required placeholder="123" inputmode="numeric">
        </div>
      </div>
      <div class="linha-grid">
        <div class="form-campo">
          <label>Bairro *</label>
          <input type="text" id="endBairro" required placeholder="Centro">
        </div>
        <div class="form-campo">
          <label>Complemento</label>
          <input type="text" id="endComplemento" placeholder="Apto 12">
        </div>
      </div>
      <div class="form-campo">
        <label>Ponto de Referência</label>
        <input type="text" id="endReferencia" placeholder="Próximo ao mercado...">
      </div>

      <div class="secao-titulo">💳 Pagamento</div>
      <div class="form-campo">
        <label>Forma de Pagamento *</label>
        <select id="pagamento" required>
          <option value="pix">PIX</option>
          <option value="dinheiro">Dinheiro (na entrega)</option>
          <option value="cartao">Cartão (na entrega)</option>
        </select>
      </div>

      <!-- BLOCO PIX -->
      <div id="blocoPix" class="bloco-pix" style="display:none;">
        <div class="label-pix">💠 Pagamento via PIX</div>
        <div id="pixConteudo"></div>
      </div>

      <div class="form-campo">
        <label>Observações (opcional)</label>
        <textarea id="obs" placeholder="Ex: Sem cebola, troco para R$50..."></textarea>
      </div>

      <div class="resumo-total" id="resumoTotal"></div>

      <button type="submit" class="btn-confirmar" id="btnEnviar">Enviar Pedido</button>
      <button type="button" class="btn-voltar" onclick="fecharCheckout()">Voltar ao cardápio</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const comercioId = urlParams.get('loja');
  let produtos = [];
  let carrinho = [];
  let estabelecimento = {
    nome: '', endereco: '', cidade: '', estado: '', telefone_whatsapp: '',
    horario_abertura: '', horario_fechamento: '', aberto_manual: true,
    taxa_entrega: 0, pedido_minimo: 0, aceita_delivery: true,
    aviso_clientes: '', chave_pix: ''
  };
  let termoBusca = '';

  // ---------- Utils ----------
  function gerarId() {
    if (window.crypto?.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  function fmt(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function mostrarToast(msg, erro) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('erro', !!erro);
    t.classList.add('visivel');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('visivel'), 2800);
  }
  function normalizar(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function normalizarTel(t) {
    return String(t || '').replace(/\D/g, '');
  }

  // ---------- Estabelecimento ----------
  async function carregarEstabelecimento() {
    if (!comercioId) return;
    try {
      const [comercioRes, dadosRes] = await Promise.all([
        window.supabaseClient.from('comercios').select('nome').eq('id', comercioId).maybeSingle(),
        window.supabaseClient.from('dados_estabelecimento').select('*').eq('comercio_id', comercioId).maybeSingle()
      ]);
      if (comercioRes.data?.nome) estabelecimento.nome = comercioRes.data.nome;
      if (dadosRes.data) {
        estabelecimento = {
          ...estabelecimento,
          endereco: dadosRes.data.endereco || '',
          cidade: dadosRes.data.cidade || '',
          estado: dadosRes.data.estado || '',
          telefone_whatsapp: dadosRes.data.telefone_whatsapp || dadosRes.data.telefone || '',
          horario_abertura: dadosRes.data.horario_abertura || '',
          horario_fechamento: dadosRes.data.horario_fechamento || '',
          aberto_manual: dadosRes.data.aberto_manual !== false,
          taxa_entrega: Number(dadosRes.data.taxa_entrega || 0),
          pedido_minimo: Number(dadosRes.data.pedido_minimo || 0),
          aceita_delivery: dadosRes.data.aceita_delivery !== false,
          aviso_clientes: dadosRes.data.aviso_clientes || '',
          chave_pix: dadosRes.data.chave_pix || ''
        };
      }
    } catch (e) {
      console.warn('Erro ao carregar estabelecimento:', e);
    }
    renderizarHeader();
    renderizarAvisoLoja();
  }

  function estaAbertoAgora() {
    if (estabelecimento.aberto_manual === false) return false;
    if (estabelecimento.aceita_delivery === false) return false;
    const { horario_abertura, horario_fechamento } = estabelecimento;
    if (!horario_abertura || !horario_fechamento) return true;
    const agora = new Date();
    const min = agora.getHours() * 60 + agora.getMinutes();
    const [hA, mA] = horario_abertura.split(':').map(Number);
    const [hF, mF] = horario_fechamento.split(':').map(Number);
    const ini = hA * 60 + (mA || 0);
    const fim = hF * 60 + (mF || 0);
    return fim < ini ? (min >= ini || min <= fim) : (min >= ini && min <= fim);
  }

  function renderizarHeader() {
    document.getElementById('nomeEstab').textContent = estabelecimento.nome || 'Cardápio Digital';

    const partes = [];
    const endCompleto = [estabelecimento.endereco, estabelecimento.cidade, estabelecimento.estado].filter(Boolean).join(' - ');
    if (endCompleto) partes.push('📍 ' + endCompleto);
    if (estabelecimento.horario_abertura && estabelecimento.horario_fechamento)
      partes.push(`🕐 ${estabelecimento.horario_abertura} às ${estabelecimento.horario_fechamento}`);
    if (estabelecimento.taxa_entrega > 0)
      partes.push(`🛵 Taxa de entrega: ${fmt(estabelecimento.taxa_entrega)}`);
    else
      partes.push('🛵 Entrega grátis');

    document.getElementById('infoEstab').innerHTML = partes.join('<br>');

    const badge = document.getElementById('badgeStatus');
    const aberto = estaAbertoAgora();
    badge.style.display = 'inline-block';
    badge.textContent = aberto ? '🟢 Aberto agora' : '🔴 Fechado';
    badge.classList.toggle('fechado', !aberto);

    if (!aberto) {
      document.getElementById('avisoFechado').innerHTML =
        '<div class="estab-fechado-aviso">😴 A loja está fechada no momento. Volte mais tarde!</div>';
    }
  }

  function renderizarAvisoLoja() {
    const el = document.getElementById('avisoLoja');
    const aviso = (estabelecimento.aviso_clientes || '').trim();
    if (!aviso) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div class="aviso-loja">
        <div class="aviso-loja-titulo">📢 Aviso da Loja</div>
        <div class="aviso-loja-texto">${aviso.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      </div>`;
  }

  // ---------- Produtos ----------
  async function carregarCardapio() {
    if (!comercioId) {
      document.getElementById('gradeProdutos').innerHTML =
        '<p class="aviso-vazio" style="color:red;">Link inválido. Faltou o ID da loja.</p>';
      return;
    }
    await carregarEstabelecimento();

    try {
      const { data, error } = await window.supabaseClient
        .from('estoque_produtos')
        .select('*')
        .eq('comercio_id', comercioId)
        .gt('quantidade', 0);
      if (error) throw error;
      produtos = data || [];
      renderizarProdutos();
    } catch (e) {
      console.error(e);
      document.getElementById('gradeProdutos').innerHTML =
        '<p class="aviso-vazio" style="color:red;">Erro ao carregar o cardápio.</p>';
    }
  }

  function produtosFiltrados() {
    if (!termoBusca) return produtos;
    const t = normalizar(termoBusca);
    return produtos.filter(p => normalizar(p.nome).includes(t));
  }

  function renderizarProdutos() {
    const grade = document.getElementById('gradeProdutos');
    const lista = produtosFiltrados();

    if (!produtos.length) {
      grade.innerHTML = '<p class="aviso-vazio">Nenhum produto disponível no momento.</p>';
      return;
    }
    if (!lista.length) {
      grade.innerHTML = `<p class="aviso-vazio">Nenhum produto encontrado para "<strong>${termoBusca}</strong>".</p>`;
      return;
    }

    grade.innerHTML = lista.map(p => {
      const noCarrinho = carrinho.find(c => String(c.id) === String(p.id));
      const qtd = noCarrinho ? noCarrinho.quantidade : 0;
      const estoque = Number(p.quantidade);
      return `
        <div class="produto">
          ${p.foto ? `<img src="${p.foto}" class="foto" alt="${p.nome}">` : `<div class="foto">🍔</div>`}
          <div class="nome">${p.nome}</div>
          <div class="preco">${fmt(p.preco)}</div>
          <div class="controle">
            <button onclick="alterarQtd('${p.id}', -1)" ${qtd === 0 ? 'disabled' : ''}>−</button>
            <span class="qtd">${qtd}</span>
            <button onclick="alterarQtd('${p.id}', 1)" ${qtd >= estoque ? 'disabled' : ''}>+</button>
          </div>
        </div>`;
    }).join('');
  }

  // ---------- Carrinho ----------
  window.alterarQtd = function (id, delta) {
    const prod = produtos.find(p => String(p.id) === String(id));
    if (!prod) return;
    const estoque = Number(prod.quantidade);
    let item = carrinho.find(c => String(c.id) === String(id));

    if (!item && delta > 0) {
      carrinho.push({ ...prod, quantidade: 1 });
    } else if (item) {
      item.quantidade += delta;
      if (item.quantidade <= 0) carrinho = carrinho.filter(c => String(c.id) !== String(id));
      else if (item.quantidade > estoque) item.quantidade = estoque;
    }
    atualizarCarrinho();
    renderizarProdutos();
    if (document.getElementById('modalCarrinho').classList.contains('aberto')) abrirCheckout();
  };

  window.removerItem = function (id) {
    carrinho = carrinho.filter(c => String(c.id) !== String(id));
    atualizarCarrinho();
    renderizarProdutos();
    abrirCheckout();
  };

  window.limparBusca = function () {
    termoBusca = '';
    document.getElementById('buscaProduto').value = '';
    document.getElementById('btnLimparBusca').classList.remove('visivel');
    renderizarProdutos();
  };

  document.getElementById('buscaProduto').addEventListener('input', (e) => {
    termoBusca = e.target.value.trim();
    document.getElementById('btnLimparBusca').classList.toggle('visivel', !!termoBusca);
    renderizarProdutos();
  });

  function calcularSubtotal() {
    return carrinho.reduce((acc, c) => acc + Number(c.preco) * c.quantidade, 0);
  }
  function calcularTaxa() {
    return calcularSubtotal() > 0 ? Number(estabelecimento.taxa_entrega || 0) : 0;
  }
  function calcularTotal() { return calcularSubtotal() + calcularTaxa(); }

  function atualizarCarrinho() {
    const bar = document.getElementById('carrinhoBar');
    const qtd = carrinho.reduce((acc, c) => acc + c.quantidade, 0);
    if (qtd > 0) {
      bar.classList.add('visivel');
      document.getElementById('qtdCarrinho').textContent = `${qtd} ${qtd === 1 ? 'item' : 'itens'}`;
      document.getElementById('totalCarrinho').textContent = fmt(calcularTotal());
      const taxa = calcularTaxa();
      document.getElementById('taxaInfo').textContent =
        taxa > 0 ? `(inclui taxa de entrega ${fmt(taxa)})` : '';
    } else {
      bar.classList.remove('visivel');
    }
  }

  function abrirCheckout() {
    const lista = document.getElementById('listaCarrinho');
    if (!carrinho.length) {
      lista.innerHTML = '<p style="text-align:center;color:#64748b;padding:20px;">Carrinho vazio</p>';
    } else {
      lista.innerHTML = carrinho.map(c => `
        <div class="item-carrinho">
          <div>
            <strong>${c.nome}</strong>
            <span>${fmt(Number(c.preco) * c.quantidade)}</span>
          </div>
          <div class="mini-controle">
            <button onclick="alterarQtd('${c.id}', -1)">−</button>
            <span style="min-width:20px;text-align:center;font-weight:900;">${c.quantidade}</span>
            <button onclick="alterarQtd('${c.id}', 1)">+</button>
            <button class="remover" onclick="removerItem('${c.id}')">✕</button>
          </div>
        </div>`).join('');
    }

    const sub = calcularSubtotal();
    const taxa = calcularTaxa();
    const total = sub + taxa;
    const abaixoMinimo = estabelecimento.pedido_minimo > 0 && sub < estabelecimento.pedido_minimo;

    document.getElementById('resumoTotal').innerHTML = `
      <div class="linha"><span>Subtotal</span><span>${fmt(sub)}</span></div>
      <div class="linha"><span>Taxa de entrega</span><span>${taxa > 0 ? fmt(taxa) : 'Grátis'}</span></div>
      <div class="linha"><span>Total</span><span>${fmt(total)}</span></div>
      ${abaixoMinimo ? `<div class="aviso-minimo">⚠️ Pedido mínimo de ${fmt(estabelecimento.pedido_minimo)}</div>` : ''}
    `;

    document.getElementById('btnEnviar').disabled = abaixoMinimo || !carrinho.length;
    document.getElementById('modalCarrinho').classList.add('aberto');
  }

  window.fecharCheckout = function () {
    document.getElementById('modalCarrinho').classList.remove('aberto');
  };

  // ---------- PIX dinâmico ----------
  function atualizarBlocoPix() {
    const pagamento = document.getElementById('pagamento').value;
    const bloco = document.getElementById('blocoPix');
    const conteudo = document.getElementById('pixConteudo');

    if (pagamento !== 'pix') {
      bloco.style.display = 'none';
      conteudo.innerHTML = '';
      return;
    }

    bloco.style.display = 'block';

    if (estabelecimento.chave_pix) {
      conteudo.innerHTML = `
        <div class="chave-pix" id="chavePixValor">${estabelecimento.chave_pix.replace(/</g,'&lt;')}</div>
        <button type="button" class="btn-copiar-pix" onclick="copiarPix()">📋 Copiar chave PIX</button>
        <div class="aviso-pix">⚠️ Seu pedido só será <strong>aceito após a confirmação do pagamento</strong>. Envie o comprovante no WhatsApp da loja.</div>
      `;
    } else {
      conteudo.innerHTML = `
        <div class="aviso-pix">💡 A loja ainda não cadastrou a chave PIX. Entre em contato pelo WhatsApp para receber a chave e enviar o comprovante. Seu pedido só será aceito após confirmação do pagamento.</div>
      `;
    }
  }

  window.copiarPix = async function () {
    try {
      await navigator.clipboard.writeText(estabelecimento.chave_pix);
      mostrarToast('✅ Chave PIX copiada!');
    } catch (e) {
      prompt('Copie a chave PIX:', estabelecimento.chave_pix);
    }
  };

  document.getElementById('pagamento').addEventListener('change', atualizarBlocoPix);

  // ---------- Endereço ----------
  function formatarEndereco() {
    const rua = document.getElementById('endRua').value.trim();
    const num = document.getElementById('endNumero').value.trim();
    const bairro = document.getElementById('endBairro').value.trim();
    const compl = document.getElementById('endComplemento').value.trim();
    const ref = document.getElementById('endReferencia').value.trim();
    if (!rua || !num || !bairro) return '';
    let end = `${rua}, ${num} - ${bairro}`;
    if (compl) end += ` (${compl})`;
    if (ref) end += ` — Ref: ${ref}`;
    return end;
  }

  function preencherDadosCliente() {
    try {
      const info = JSON.parse(localStorage.getItem('drTroco_cliente_info') || '{}');
      if (info.nome) document.getElementById('nomeCliente').value = info.nome;
      if (info.telefone) document.getElementById('telefoneCliente').value = info.telefone;
      if (info.rua) document.getElementById('endRua').value = info.rua;
      if (info.numero) document.getElementById('endNumero').value = info.numero;
      if (info.bairro) document.getElementById('endBairro').value = info.bairro;
      if (info.complemento) document.getElementById('endComplemento').value = info.complemento;
      if (info.referencia) document.getElementById('endReferencia').value = info.referencia;
    } catch (e) {}
  }

  function salvarDadosCliente() {
    try {
      localStorage.setItem('drTroco_cliente_info', JSON.stringify({
        nome: document.getElementById('nomeCliente').value.trim(),
        telefone: document.getElementById('telefoneCliente').value.trim(),
        rua: document.getElementById('endRua').value.trim(),
        numero: document.getElementById('endNumero').value.trim(),
        bairro: document.getElementById('endBairro').value.trim(),
        complemento: document.getElementById('endComplemento').value.trim(),
        referencia: document.getElementById('endReferencia').value.trim()
      }));
    } catch (e) {}
  }

  // ---------- Envio ----------
  document.getElementById('formPedido').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!carrinho.length) return mostrarToast('Carrinho vazio.', true);
    if (!comercioId) return mostrarToast('Loja não identificada.', true);
    if (!estaAbertoAgora()) return mostrarToast('A loja está fechada agora.', true);

    const sub = calcularSubtotal();
    if (estabelecimento.pedido_minimo > 0 && sub < estabelecimento.pedido_minimo) {
      return mostrarToast(`Pedido mínimo de ${fmt(estabelecimento.pedido_minimo)}.`, true);
    }

    const endereco = formatarEndereco();
    if (!endereco) return mostrarToast('Preencha o endereço completo (rua, número e bairro).', true);

    const nome = document.getElementById('nomeCliente').value.trim();
    const telefone = normalizarTel(document.getElementById('telefoneCliente').value);
    const pagamento = document.getElementById('pagamento').value;
    const obs = document.getElementById('obs').value.trim();
    const taxa = calcularTaxa();
    const total = calcularTotal();

    if (telefone.length < 10) return mostrarToast('WhatsApp inválido.', true);

    const btn = document.getElementById('btnEnviar');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    const itensFormatados = carrinho.map(c => ({
      id: c.id, nome: c.nome, quantidade: c.quantidade,
      valorUnitarioCentavos: Math.round(Number(c.preco) * 100)
    }));

    const pedido = {
      id: gerarId(),
      comercio_id: comercioId,
      mesa_nome: 'Delivery Online',
      codigo_qr: 'DELIVERY',
      cliente_nome: nome,
      cliente_telefone: telefone,
      endereco_entrega: endereco,
      itens: itensFormatados,
      total: total,
      taxa_entrega: taxa,
      status: 'aberta',
      forma_pagamento: pagamento,
      origem: 'cardapio',
      observacao: obs,
      atualizado_em: new Date().toISOString()
    };

    try {
      const { error } = await window.supabaseClient.from('comandas_abertas').insert([pedido]);
      if (error) throw error;

      // WhatsApp do cliente
      const msgCliente = encodeURIComponent(
        `Olá ${nome}! Seu pedido foi recebido.\n` +
        `Total: ${fmt(total)}\n` +
        (pagamento === 'pix'
          ? `💠 Chave PIX: ${estabelecimento.chave_pix || '(peça à loja)'}\n⚠️ Envie o comprovante após o pagamento.\n`
          : '') +
        `Você receberá atualizações por aqui. Obrigado!`
      );
      window.open(`https://wa.me/55${telefone}?text=${msgCliente}`, '_blank');

      // Notifica a loja
      if (estabelecimento.telefone_whatsapp) {
        const telEstab = normalizarTel(estabelecimento.telefone_whatsapp);
        if (telEstab) {
          const msgEstab = encodeURIComponent(
            `🛵 NOVO PEDIDO #${pedido.id.slice(0, 4)}\n` +
            `Cliente: ${nome} (${telefone})\n` +
            `Endereço: ${endereco}\n` +
            `Itens: ${carrinho.map(c => `${c.quantidade}x ${c.nome}`).join(', ')}\n` +
            `Total: ${fmt(total)}\n` +
            `Pagamento: ${pagamento}\n` +
            (obs ? `Obs: ${obs}` : '')
          );
          setTimeout(() => window.open(`https://wa.me/55${telEstab}?text=${msgEstab}`, '_blank'), 800);
        }
      }

      salvarDadosCliente();
      mostrarToast('Pedido enviado com sucesso! 🛵');
      carrinho = [];
      atualizarCarrinho();
      renderizarProdutos();
      fecharCheckout();
      document.getElementById('formPedido').reset();
      atualizarBlocoPix();
      preencherDadosCliente();
    } catch (err) {
      console.error(err);
      mostrarToast('Erro ao enviar. Tente novamente.', true);
    } finally {
      btn.textContent = 'Enviar Pedido';
      btn.disabled = false;
    }
  });

  setInterval(() => { renderizarHeader(); }, 60000);

  // Boot
  preencherDadosCliente();
  carregarCardapio();
</script>
</body>
  </html>
