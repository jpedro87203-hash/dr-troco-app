
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste Supabase - Dr. Troco</title>
</head>
<body>
  <h2>Teste de conexão</h2>
  <p id="resultado">Consultando o banco...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    async function testar() {
      const resultado = document.getElementById("resultado");

      try {
        const { data, error } = await window.supabaseClient
          .from("comercios")
          .select("uuid")
          .limit(1);

        if (error) {
          resultado.textContent =
            "Cliente carregado, mas a consulta falhou: " +
            error.message;
          return;
        }

        resultado.textContent =
          "Consulta realizada! Registros retornados: " + data.length;
      } catch (erro) {
        resultado.textContent = "Erro: " + erro.message;
      }
    }

    testar();
  </script>
</body>
</html>
