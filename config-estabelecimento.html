<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configurar Estabelecimento</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; padding: 16px 16px 100px; color: #263640; }
    .card { background: #fff; max-width: 520px; margin: 0 auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.06); }
    h2 { margin: 0 0 16px; color: #168b53; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 12px; font-weight: 800; color: #475569; margin: 12px 0 4px; }
    input, select, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0 12px; font-size: 14px; box-sizing: border-box; outline: none; font-family: inherit; }
    input, select { height: 44px; }
    textarea { padding: 10px 12px; height: 80px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .area-logo { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .preview-logo { width: 64px; height: 64px; border-radius: 14px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; flex-shrink: 0; border: 2px dashed #cbd5e1; }
    .preview-logo img { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-file { display: inline-block; background: #f1f5f9; color: #3b82f6; border: 1px solid #bfdbfe; padding: 10px 16px; border-radius: 10px; font-weight: 900; font-size: 13px; cursor: pointer; text-align: center; }
    input[type="file"] { display: none; }

    button.btn-salvar { width: 100%; height: 48px; margin-top: 20px; background: #168b53; color: #fff; border: 0; border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer; }
    button.btn-salvar:disabled { opacity: 0.6; }
    
    .msg { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 900; text-align: center; display: none; }
    .ok { background: #d1fae5; color: #047857; border: 2px solid #10b981; }
    .err { background: #fee2e2; color: #b91c1c; border: 2px solid #ef4444; white-space: pre-wrap; font-family: monospace; font-size: 12px; text-align: left; }
    
    .ajuda { font-size: 10px; color: #94a3b8; margin-top: 2px; display: block; font-weight: normal; }
    .voltar { display: block; text-align: center; margin-top: 16px; color: #64748b; text-decoration: none; font-size: 13px; font-weight: bold; }
    
    .secao-titulo { font-size: 12px; font-weight: 900; color: #168b53; text-transform: uppercase; margin: 20px 0 8px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }

    /* 🔹 SLUG */
    .preview-link {
      margin-top: 8px; padding: 10px 12px; background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 10px; font-size: 12px; color: #166534; word-break: break-all; line-height: 1.5;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .preview-link code { background: #fff; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 11px; color: #15803d; }
    .btn-copiar-link { background: #168b53; color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 800; cursor: pointer; margin-left: auto; }
    .btn-copiar-link:hover { background: #14744a; }
    .slug-input-wrap { position: relative; }
    .slug-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 13px; font-weight: 700; pointer-events: none; }
    .slug-input-wrap input { padding-left: 110px; }

    /* 🔹 LOJA ABERTA/FECHADA */
    .status-loja-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .status-loja-box.aberto { border-color: #bbf7d0; background: #f0fdf4; }
    .status-loja-box.fechado { border-color: #fecaca; background: #fef2f2; }
    .status-loja-box label { margin: 0; font-size: 13px; color: #1e293b; }
    .status-loja-box select { width: auto; height: 38px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🏪 Meu Estabelecimento</h2>

    <!-- 🔹 NOVO: CONTROLE DE STATUS MANUAL -->
    <div class="secao-titulo">🚦 Status do Atendimento</div>
    <div class="status-loja-box" id="boxStatusLoja">
      <div>
        <label for="aberto_manual">Aceitando Pedidos?</label>
        <span class="ajuda">Se fechar, o cardápio pausa na hora.</span>
      </div>
      <select id="aberto_manual" onchange="atualizarCorStatus()">
        <option value="true">✅ Aberta</option>
        <option value="false">⏸️ Fechada</option>
      </select>
    </div>
    
    <label>Logo da Loja <span class="ajuda">(JPG ou PNG, máx 2MB)</span></label>
    <div class="area-logo">
      <div class="preview-logo" id="previewLogo">🏪</div>
      <div style="flex:1;">
        <label for="fileLogo" class="btn-file">📷 Escolher da Galeria</label>
        <input type="file" id="fileLogo" accept="image/*" onchange="previewImagem(event)">
        <input type="hidden" id="logo_url">
      </div>
    </div>

    <label>Nome da Loja</label>
    <input type="text" id="nome" placeholder="Ex: Asas Lanches">

    <div class="secao-titulo">🔗 Link do Cardápio Digital</div>

    <label>Link personalizado <span class="ajuda">(Só letras minúsculas, números e hífen. Mín. 3 caracteres)</span></label>
    <div class="slug-input-wrap">
      <span class="slug-prefix">cardapio.html?loja=</span>
      <input type="text" id="slug" placeholder="asas-lanches" maxlength="40" pattern="[a-z0-9\-]+" oninput="normalizarSlug(this)">
    </div>
    <div class="preview-link" id="previewLink">
      <span>Seu link:</span>
      <code id="previewLinkTexto">cardapio.html?loja=...</code>
      <button type="button" class="btn-copiar-link" id="btnCopiarLink" onclick="copiarLinkCardapio()" style="display:none;">📋 Copiar</button>
    </div>

    <div class="secao-titulo">📍 Endereço e Entregas</div>
    
    <label>Endereço da Loja</label>
    <input type="text" id="endereco" placeholder="Ex: Av. Brasil">

    <label>Cidade Principal</label>
    <input type="text" id="cidade" placeholder="Ex: Santa Helena">

    <div class="grid2">
      <div><label>Estado</label><input type="text" id="estado" maxlength="2"></div>
      <div><label>Taxa Cidade Principal (R$)</label><input type="number" id="taxa_entrega" min="0" step="0.50" value="0"></div>
    </div>

    <label>Cidade Vizinha <span class="ajuda">(Opcional)</span></label>
    <div class="grid2">
      <div><input type="text" id="cidade_vizinha" placeholder="Nome da cidade"></div>
      <div><input type="number" id="taxa_entrega_vizinha" min="0" step="0.50" value="0" placeholder="Taxa R$"></div>
    </div>

    <div class="secao-titulo">⏰ Horário Padrão</div>

    <div class="grid2">
      <div><label>Abre às</label><input type="time" id="horario_abertura"></div>
      <div><label>Fecha às</label><input type="time" id="horario_fechamento"></div>
    </div>

    <div class="grid2">
      <div><label>Pedido Mínimo (R$)</label><input type="number" id="pedido_minimo" min="0" step="0.50" value="0"></div>
      <div>
        <label>Aceitar Delivery?</label>
        <select id="aceita_delivery">
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>
      </div>
    </div>

    <label>WhatsApp da Loja <span class="ajuda">(Ex: 5511999999999)</span></label>
    <input type="tel" id="telefone_whatsapp" placeholder="5511999999999">

    <label>Chave PIX</label>
    <input type="text" id="chave_pix" placeholder="Sua chave PIX aqui">

    <label>Aviso aos Clientes <span class="ajuda">(Aparecerá no topo do cardápio)</span></label>
    <textarea id="aviso_clientes" placeholder="Ex: Pagamento pix, envio só após envio do comprovante"></textarea>

    <button class="btn-salvar" id="btnSalvar" onclick="salvar()">Salvar Configurações</button>
    <div id="msg" class="msg"></div>
    
    <a href="pedidos.html" class="voltar">← Voltar para Pedidos</a>
  </div>

  <script>
    let comercioId = null;
    let arquivoSelecionado = null;
    let slugOriginal = ''; 

    function atualizarCorStatus() {
      const box = document.getElementById('boxStatusLoja');
      const isAberto = document.getElementById('aberto_manual').value === 'true';
      box.className = 'status-loja-box ' + (isAberto ? 'aberto' : 'fechado');
    }

    function normalizarSlug(input) {
      let v = input.value.toLowerCase();
      v = v.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      v = v.replace(/[^a-z0-9\-]/g, '-');
      v = v.replace(/-+/g, '-').replace(/^-|-$/g, '');
      input.value = v;
      atualizarPreviewSlug();
    }

    function atualizarPreviewSlug() {
      const slug = document.getElementById('slug').value.trim();
      const previewEl = document.getElementById('previewLinkTexto');
      const btn = document.getElementById('btnCopiarLink');

      if (!slug) {
        previewEl.textContent = 'cardapio.html?loja=...';
        btn.style.display = 'none';
        return;
      }

      const base = window.location.origin + window.location.pathname.replace('config-estabelecimento.html', 'cardapio.html');
      const link = base + '?loja=' + slug;
      previewEl.textContent = link;
      btn.style.display = 'inline-block';
    }

    window.copiarLinkCardapio = async function () {
      const slug = document.getElementById('slug').value.trim();
      if (!slug) return;

      const base = window.location.origin + window.location.pathname.replace('config-estabelecimento.html', 'cardapio.html');
      const link = base + '?loja=' + slug;

      try {
        await navigator.clipboard.writeText(link);
        alert('Link copiado!\n\n' + link);
      } catch (e) {
        prompt('Copie o link abaixo:', link);
      }
    };

    function previewImagem(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        alert("A imagem é muito grande. Escolha uma foto de até 2MB.");
        event.target.value = '';
        return;
      }
      arquivoSelecionado = file;
      const preview = document.getElementById('previewLogo');
      const reader = new FileReader();
      reader.onload = function(e) { preview.innerHTML = `<img src="${e.target.result}">`; };
      reader.readAsDataURL(file);
    }

    async function obterComercioIdConfig() {
      if (window.EstoqueSupabase?.obterComercioId) {
        try {
          const id = await window.EstoqueSupabase.obterComercioId();
          if (id && id !== 'undefined') return id;
        } catch(e) {}
      }
      const lsKeys = ['drTroco_comercio_id', 'comercio_id', 'comercioId', 'drTroco_loja_id'];
      for (const key of lsKeys) {
        const id = localStorage.getItem(key);
        if (id && id !== 'undefined' && id.length > 10) return id;
      }
      try {
        if (window.supabaseClient) {
          const { data: { user } } = await window.supabaseClient.auth.getUser();
          if (user) {
            const { data: membro } = await window.supabaseClient.from('membros_comercio').select('comercio_id').eq('usuario_id', user.id).maybeSingle();
            if (membro?.comercio_id) return membro.comercio_id;
            const { data: comercio } = await window.supabaseClient.from('comercios').select('id').eq('criado_por', user.id).maybeSingle();
            if (comercio?.id) return comercio.id;
          }
        }
      } catch(e) {}
      return null;
    }

    async function carregar() {
      try {
        comercioId = await obterComercioIdConfig();
        if (!comercioId) {
          document.getElementById('btnSalvar').disabled = true;
          return;
        }

        const [resCom, resDad] = await Promise.all([
          window.supabaseClient.from('comercios').select('nome, slug').eq('id', comercioId).maybeSingle(),
          window.supabaseClient.from('dados_estabelecimento').select('*').eq('comercio_id', comercioId).maybeSingle()
        ]);
        
        if (resCom.data?.nome) document.getElementById('nome').value = resCom.data.nome;
        if (resCom.data?.slug) {
          document.getElementById('slug').value = resCom.data.slug;
          slugOriginal = resCom.data.slug;
        }
        
        if (resDad.data) {
          const d = resDad.data;
          const campos = ['endereco', 'cidade', 'estado', 'cidade_vizinha', 'taxa_entrega_vizinha', 'telefone_whatsapp', 'horario_abertura', 'horario_fechamento', 'taxa_entrega', 'pedido_minimo', 'chave_pix', 'aviso_clientes'];
          campos.forEach(k => {
            if (d[k] != null) document.getElementById(k).value = d[k];
          });
          document.getElementById('aceita_delivery').value = d.aceita_delivery === false ? 'false' : 'true';
          // 🔹 NOVO: Carrega status manual (padrão true se não existir)
          document.getElementById('aberto_manual').value = d.aberto_manual === false ? 'false' : 'true';
          atualizarCorStatus();
          
          if (d.logo_url) {
            document.getElementById('logo_url').value = d.logo_url;
            document.getElementById('previewLogo').innerHTML = `<img src="${d.logo_url}">`;
          }
        } else {
          atualizarCorStatus(); // Define a cor inicial se não houver dados
        }

        atualizarPreviewSlug();
      } catch(e) { console.error("Erro ao carregar:", e); }
    }

    const SLUGS_RESERVADOS = [
      'cardapio', 'pedidos', 'entrega', 'config', 'config-estabelecimento',
      'www', 'api', 'admin', 'app', 'dr-troco', 'drtroco',
      'index', 'fluxo', 'historico', 'estoque', 'fiado', 'comandas',
      'login', 'cadastro', 'signup', 'static', 'assets'
    ];

    async function salvar() {
      const msgEl = document.getElementById('msg');
      if (!comercioId) return alert("Loja não identificada. Faça login novamente.");

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      msgEl.style.display = 'none';
      msgEl.textContent = '';

      let logoUrlFinal = document.getElementById('logo_url').value;
      const slug = document.getElementById('slug').value.trim().toLowerCase();

      if (slug) {
        if (slug.length < 3) {
          msgEl.className = 'msg err';
          msgEl.textContent = 'O link personalizado precisa ter pelo menos 3 caracteres.';
          msgEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Salvar Configurações';
          return;
        }
        if (SLUGS_RESERVADOS.includes(slug)) {
          msgEl.className = 'msg err';
          msgEl.textContent = `O link "${slug}" é reservado. Escolha outro.`;
          msgEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Salvar Configurações';
          return;
        }
      }

      try {
        if (arquivoSelecionado) {
          btn.textContent = 'Enviando Imagem...';
          const extensao = arquivoSelecionado.name.split('.').pop();
          const nomeArquivo = `${comercioId}-logo-${Date.now()}.${extensao}`;

          const { error: uploadError } = await window.supabaseClient.storage.from('logos').upload(nomeArquivo, arquivoSelecionado, { upsert: true });
          if (uploadError) throw new Error("Falha no upload da imagem: " + uploadError.message);

          const { data: publicUrlData } = window.supabaseClient.storage.from('logos').getPublicUrl(nomeArquivo);
          logoUrlFinal = publicUrlData.publicUrl;
        }

        btn.textContent = 'Salvando Dados...';
        const nome = document.getElementById('nome').value.trim();
        
        const payload = {
          comercio_id: comercioId,
          logo_url: logoUrlFinal,
          endereco: document.getElementById('endereco').value.trim(),
          cidade: document.getElementById('cidade').value.trim(),
          estado: document.getElementById('estado').value.trim().toUpperCase(),
          cidade_vizinha: document.getElementById('cidade_vizinha').value.trim(),
          taxa_entrega_vizinha: Number(document.getElementById('taxa_entrega_vizinha').value) || 0,
          telefone_whatsapp: document.getElementById('telefone_whatsapp').value.trim(),
          horario_abertura: document.getElementById('horario_abertura').value,
          horario_fechamento: document.getElementById('horario_fechamento').value,
          taxa_entrega: Number(document.getElementById('taxa_entrega').value) || 0,
          pedido_minimo: Number(document.getElementById('pedido_minimo').value) || 0,
          aceita_delivery: document.getElementById('aceita_delivery').value === 'true',
          aberto_manual: document.getElementById('aberto_manual').value === 'true', // 🔹 NOVO
          chave_pix: document.getElementById('chave_pix').value.trim(),
          aviso_clientes: document.getElementById('aviso_clientes').value.trim(),
          atualizado_em: new Date().toISOString()
        };

        const updateComercio = {};
        if (nome) updateComercio.nome = nome;
        if (slug && slug !== slugOriginal) updateComercio.slug = slug;

        if (Object.keys(updateComercio).length > 0) {
          const { error: errCom } = await window.supabaseClient.from('comercios').update(updateComercio).eq('id', comercioId);
          if (errCom) {
            if (errCom.code === '23505' || /duplicate key|unique/i.test(errCom.message || '')) {
              throw new Error('Este link já está em uso. Escolha outro.');
            }
            throw errCom;
          }
          if (slug) slugOriginal = slug;
        }
        
        const { error: errUpd } = await window.supabaseClient.from('dados_estabelecimento').upsert(payload, { onConflict: 'comercio_id' });
        if (errUpd) throw errUpd;

        msgEl.className = 'msg ok';
        msgEl.innerHTML = '✅ Configurações e Link salvos com sucesso!';
        msgEl.style.display = 'block';
        
        arquivoSelecionado = null; 
        
        setTimeout(() => { 
          msgEl.style.display = 'none'; 
          msgEl.className = 'msg';
        }, 4000);

      } catch(e) {
        console.error("Erro no save:", e);
        msgEl.className = 'msg err';
        msgEl.textContent = 'Erro: ' + e.message + '\nDetalhes: ' + (e.details || 'Nenhum.');
        msgEl.style.display = 'block';
        alert("Ocorreu um erro ao salvar. Verifique a mensagem em vermelho na tela.");
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar Configurações';
      }
    }

    window.addEventListener('DOMContentLoaded', () => { setTimeout(carregar, 200); });
  </script>
</body>
</html>
