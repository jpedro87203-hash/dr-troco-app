<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ea580c">
  <title>Dr. Troco - Pedidos Online</title>
  
  <link rel="stylesheet" href="style.css">
  <!-- BIBLIOTECA DE QR CODE ADICIONADA AQUI -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <style>
    body { background: #f8fafc; font-family: Arial, sans-serif; margin: 0; padding-bottom: 100px; }
    .header-pedidos { background: linear-gradient(135deg, #ea580c, #c2410c); color: #fff; padding: 20px 16px; border-radius: 0 0 24px 24px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.2); }
    .header-pedidos h1 { margin: 0; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .header-pedidos p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
    
    .container { max-width: 760px; margin: 0 auto; padding: 16px; }
    
    /* Abas de Filtro */
    .abas-pedidos { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; scrollbar-width: none; }
    .abas-pedidos::-webkit-scrollbar { display: none; }
    .aba-btn { flex: 0 0 auto; padding: 10px 16px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; color: #64748b; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.15s; }
    .aba-btn.ativo { background: #ea580c; color: #fff; border-color: #ea580c; }
    
    /* Cards de Pedido */
    .lista-pedidos { display: flex; flex-direction: column; gap: 12px; }
    .card-pedido { background: #fff; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-left: 5px solid #ea580c; }
    .card-pedido.status-preparando { border-left-color: #3b82f6; }
    .card-pedido.status-rota { border-left-color: #10b981; }
    
    .pedido-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .pedido-id { font-size: 11px; color: #94a3b8; font-weight: 800; text-transform: uppercase; }
    .pedido-total { font-size: 18px; font-weight: 900; color: #1e293b; }
    .pedido-cliente { font-size: 15px; font-weight: 900; color: #1e293b; margin-bottom: 4px; }
    .pedido-info { font-size: 13px; color: #64748b; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .pedido-obs { font-size: 12px; background: #fff7ed; color: #c2410c; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; border-left: 2px solid #ea580c; font-weight: 600; }
    
    .pedido-itens { background: #f8fafc; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .pedido-item-linha { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .pedido-item-linha:last-child { margin-bottom: 0; }
    
    .pedido-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-acao { padding: 12px; border: 0; border-radius: 10px; font-size: 13px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-aceitar { background: #ea580c; color: #fff; }
    .btn-preparar { background: #3b82f6; color: #fff; }
    .btn-rota { background: #10b981; color: #fff; }
    .btn-finalizar { background: #1e293b; color: #fff; }
    .btn-recusar { background: #fee2e2; color: #dc2626; }
    
    .vazio { text-align: center; padding: 40px 20px; background: #fff; border-radius: 16px; border: 1px dashed #cbd5e1; color: #64748b; }
    .vazio h3 { color: #1e293b; margin: 0 0 8px 0; }
  </style>
</head>
<body class="pagina-pedidos">
  <div class="header-pedidos">
    <h1>🛵 Pedidos Online</h1>
    <p>Acompanhe as entregas do cardápio digital</p>
  </div>

  <div class="container">
    
    <!-- NOVO: CARD DE DIVULGAÇÃO DO CARDÁPIO -->
    <div style="background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
        <div style="width: 44px; height: 44px; background: #eaf8f0; color: #168b53; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 22px;">🔗</div>
        <div style="flex: 1;">
          <strong style="display: block; font-size: 15px; color: #1e293b;">Seu Cardápio Digital</strong>
          <span style="font-size: 12px; color: #64748b;">Envie este link para seus clientes fazerem pedidos</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button type="button" onclick="copiarLinkCardapio()" style="background: #f8fafc; border: 1px solid #cbd5e1; color: #334155; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">📋 Copiar Link</button>
        <button type="button" onclick="baixarQrCardapio()" style="background: #168b53; border: 0; color: #fff; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">📱 Baixar QR Code</button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="abas-pedidos">
      <button class="aba-btn ativo" data-filtro="aguardando">⏳ Aguardando</button>
      <button class="aba-btn" data-filtro="preparando">👨‍🍳 Preparando</button>
      <button class="aba-btn" data-filtro="rota">🛵 Em Rota</button>
      <button class="aba-btn" data-filtro="concluidos">✅ Concluídos</button>
    </div>

    <!-- Lista -->
    <div id="listaPedidos" class="lista-pedidos">
      <div class="vazio">
        <h3>Carregando pedidos...</h3>
        <p>Aguarde um instante.</p>
      </div>
    </div>
  </div>

  <!-- Menu Inferior -->
  <nav class="menu-inferior" aria-label="Navegação principal">
    <a href="index.html" class="menu-item"><span>🧮</span><small>Calculadora</small></a>
    <a href="fluxo.html" class="menu-item"><span>📊</span><small>Fluxo</small></a>
    <a href="historico.html" class="menu-item"><span>📋</span><small>Histórico</small></a>
    <a href="estoque.html" class="menu-item"><span>📦</span><small>Estoque</small></a>
    <a href="fiado.html" class="menu-item"><span>🧾</span><small>Fiado</small></a>
    <a href="comandas.html" class="menu-item"><span>🍽️</span><small>Comandas</small></a>
    <a href="pedidos.html" class="menu-item ativo" style="color:#ea580c;"><span>🛵</span><small>Pedidos</small></a>
  <a href="config-estabelecimento.html" class="menu-item"><span>⚙️</span><small>Config</small></a>
  </nav>
  

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-guard.js"></script>
  <script src="dados-supabase.js"></script>
  <script src="estoque-supabase.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
